<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审计智能化平台 · 知识图谱</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root{
    --bg:#ffffff; --panel:#f8f9fa; --panel2:#eef1f5; --border:#d8dde5;
    --text:#1a1d29; --dim:#6c757d; --accent:#4A90D9;
    --ml:#4A90D9; --llm:#E67E22; --kg:#27AE60; --rpa:#9B59B6;
    --cv:#E74C3C; --bc:#F39C12; --fl:#1ABC9C; --st:#5D6D7E;
    --rs:#16A085; --db:#D35400;
    --infra:#3498DB; --platform:#9B59B6; --app:#E67E22;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  #app{display:flex;flex-direction:column;height:100%}

  /* 顶栏 */
  #topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);z-index:10;flex-shrink:0}
  #topbar .logo{font-size:17px;font-weight:700;white-space:nowrap;background:linear-gradient(90deg,#4A90D9,#27AE60);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  #breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);flex-wrap:wrap}
  #breadcrumb .crumb{cursor:pointer;padding:3px 9px;border-radius:4px;transition:.15s;white-space:nowrap}
  #breadcrumb .crumb:hover{background:var(--panel2);color:var(--text)}
  #breadcrumb .crumb.active{color:var(--accent);font-weight:600}
  #breadcrumb .sep{color:var(--border)}
  #stats{margin-left:auto;font-size:12px;color:var(--dim);white-space:nowrap}

  /* 主体 */
  #main{display:flex;flex:1;overflow:hidden}
  #canvas-wrap{flex:1;position:relative;overflow:hidden}
  svg{width:100%;height:100%;display:block}
  #sidebar{width:340px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:18px;flex-shrink:0}
  #sidebar h3{font-size:14px;color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .info-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
  .info-row .k{color:var(--dim)}
  .info-row .v{color:var(--text);font-weight:500;text-align:right}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;margin:2px}
  .dep-list{margin-top:8px}
  .dep-item{padding:5px 8px;margin:3px 0;background:var(--panel2);border-radius:5px;font-size:12px;cursor:pointer;transition:.15s}
  .dep-item:hover{background:var(--border);transform:translateX(3px)}
  .dep-item .arrow{color:var(--dim);margin:0 5px}

  /* 图例 */
  #legend{position:absolute;bottom:16px;left:16px;background:rgba(248,249,250,.92);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:12px;max-width:220px}
  #legend .lg-title{font-weight:600;margin-bottom:8px;color:var(--dim)}
  .lg-item{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;transition:.15s;border-radius:4px;padding-left:4px}
  .lg-item:hover{background:var(--panel2)}
  .lg-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}

  /* tooltip */
  #tooltip{position:absolute;pointer-events:none;background:rgba(248,249,250,.96);border:1px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:12px;max-width:260px;z-index:100;opacity:0;transition:opacity .15s;box-shadow:0 4px 20px rgba(0,0,0,.5)}
  #tooltip .tt-title{font-weight:600;margin-bottom:4px}
  #tooltip .tt-sub{color:var(--dim)}

  /* hint */
  #hint{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(74,144,217,.15);border:1px solid var(--accent);border-radius:20px;padding:6px 18px;font-size:12px;color:var(--accent);pointer-events:none;transition:opacity .3s}

  /* node 样式 */
  .node{cursor:pointer}
  .node circle{transition:r .2s,stroke-width .2s}
  .node:hover circle{filter:brightness(1.3)}
  .node text{pointer-events:none;text-anchor:middle;fill:var(--text);font-size:11px;text-shadow:0 1px 3px rgba(255,255,255,.8)}
  .node.domain text{font-size:14px;font-weight:600}
  .node.platform text{font-size:13px;font-weight:600}
  .link{fill:none;stroke:var(--border);stroke-width:1.2;opacity:.5;transition:opacity .2s}
  .link.platform{stroke-dasharray:4 3}
  .link.highlight{opacity:.9;stroke-width:2}
  .layer-label{fill:var(--dim);font-size:13px;font-weight:600;text-anchor:start}

  /* 详情面板 */
  .detail-card{background:var(--panel2);border-radius:8px;padding:12px;margin:8px 0;border-left:3px solid var(--accent)}
  .detail-card .dc-title{font-size:13px;font-weight:600;margin-bottom:6px}
  .detail-card .dc-content{font-size:12px;color:var(--dim);line-height:1.6}
  .comp-node{cursor:pointer}
  .comp-node rect{rx:6;transition:.15s}
  .comp-node:hover rect{filter:brightness(1.25)}
</style>
</head>
<body>
<div id="app">

    <div class="logo">审计智能化平台 · 知识图谱</div>

  </div>
  <div id="main">

      <svg id="graph"></svg>

/* ======================= D3 画布 ======================= */
const svg = d3.select("#graph");
let W = svg.node().clientWidth, H = svg.node().clientHeight;
let g = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.2,5]).on("zoom",e=>g.attr("transform",e.transform));
svg.call(zoom);
svg.on("dblclick.zoom",null);

function clearCanvas(){ g.selectAll("*").remove(); }
function resetZoom(){ svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity); }
// 自动适配内容到可视区（居中 + 缩放）
function fitContent(pad){
  pad = pad||60;
  const bbox = g.node().getBBox();
  if(!bbox.width || !bbox.height) return;
  const cw = svg.node().clientWidth, ch = svg.node().clientHeight;
  const scale = Math.min((cw-pad*2)/bbox.width, (ch-pad*2)/bbox.height, 1.2);
  const tx = cw/2 - (bbox.x + bbox.width/2)*scale;
  const ty = ch/2 - (bbox.y + bbox.height/2)*scale;
  svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(scale));
}

window.addEventListener("resize",()=>{W=svg.node().clientWidth;H=svg.node().clientHeight;});

// 数据流高亮状态（L2 点击接口标签时高亮该数据流路径）
let highlightedFlow = null;
function highlightFlow(peerSlug,dir){
  const key = dir+":"+peerSlug;
  if(highlightedFlow===key){
    highlightedFlow=null;
    g.selectAll(".iface-link").style("opacity",0.5).attr("stroke-width",1.8);
    g.selectAll(".iface-label").style("opacity",1);
    return;
  }
  highlightedFlow=key;
  g.selectAll(".iface-link").style("opacity",0.12);
  g.selectAll(".iface-label").style("opacity",0.12);
  g.selectAll(".iface-link").each(function(d){
    if(d && d.peer===peerSlug && d.dir===dir) d3.select(this).style("opacity",1).attr("stroke-width",3);
  });
  g.selectAll(".iface-label").each(function(d){
    if(d && d.peer===peerSlug && d.dir===dir) d3.select(this).style("opacity",1);
  });
}

function moduleSidebar(m){

    <div class="info-row"><span class="k">下游被依赖</span><span class="v">${down.length} 个</span></div>
    <h3 style="margin-top:16px">内部组件</h3>`;
  compList.forEach(([f,c,d])=>{
    html+=`<div class="dep-item" onclick="drillComponent('${m.slug}','${f}')"><b>${f}</b> <span style="color:var(--dim)">· ${c}</span><br><span style="color:var(--dim);font-size:11px">${d}</span></div>`;
  });
  if(up.length){
    html+=`<h3 style="margin-top:16px">上游依赖</h3><div class="dep-list">`;

  renderSidebar(html);

  renderSidebar(`<h3>全景视图</h3>
    <p style="color:var(--dim);font-size:13px;line-height:1.7">审计智能化平台采用三层架构：<br><br>
    <b style="color:var(--infra)">🔵 基础平台层</b>（5个）：数据接入与存储底座，被广泛依赖<br>
    <b style="color:var(--platform)">🟣 共享平台层</b>（5个）：ML/KG/LLM/RPA/GNN 统一能力<br>
    <b style="color:var(--app)">🟠 应用层</b>（12域78模块）：面向各审计业务场景<br><br>
    点击<b>业务域节点</b>进入域内详情，点击<b>平台节点</b>查看使用方。</p>
    <div class="detail-card"><div class="dc-title">📊 规模</div><div class="dc-content">
      78 个模块 · 3045 项测试全绿<br>
      10 种技术家族<br>
      12 个审计业务域</div></div>`);

  const layerY = {infra:H*0.75, platform:H*0.48, app:H*0.22};
  // 层标签
  g.append("text").attr("class","layer-label").attr("x",30).attr("y",layerY.app-40).text("🟠 应用层 · 12 业务域");
  g.append("text").attr("class","layer-label").attr("x",30).attr("y",layerY.platform-40).text("🟣 共享平台层 · 5 大能力");
  g.append("text").attr("class","layer-label").attr("x",30).attr("y",layerY.infra-40).text("🔵 基础平台层 · 数据底座");

  // 基础层节点
  const infraNodes = INFRA.map((s,i)=>({...M[s], fx:W*0.15+i*(W*0.7/(INFRA.length-1)), fy:layerY.infra}));
  // 平台节点
  const platNodes = PLATFORMS.map((p,i)=>({...p, slug:p.id, fx:W*0.1+i*(W*0.8/(PLATFORMS.length-1)), fy:layerY.platform}));
  // 应用层 = 12 业务域聚合
  const domains = Object.keys(DOMAIN_NAME);
  const domNodes = domains.map((d,i)=>{
    const mods = MODULES.filter(m=>m.domain===DOMAIN_NAME[d]);
    const fams = [...new Set(mods.map(m=>m.family))];
    return {slug:"D_"+d, name:DOMAIN_NAME[d], domain:DOMAIN_NAME[d], count:mods.length,
      families:fams, fx:W*0.06+i*(W*0.88/(domains.length-1)), fy:layerY.app};
  });

  const allNodes = [...infraNodes, ...platNodes, ...domNodes];
  const idMap = {}; allNodes.forEach(n=>idMap[n.slug]=n);

  // 边：基础→平台（虚线），平台→域（按家族统计）
  const edges = [];
  // 平台→域（每个域连接它用到的平台）
  domNodes.forEach(dn=>{
    PLATFORMS.forEach(p=>{
      const used = dn.families.some(f=>p.families.includes(f)) || (p.id==="P_GNN"&&dn.domain==="合规审计");
      if(used) edges.push({s:p.id,t:dn.slug,type:"platform"});
    });
  });
  // 基础层→应用层关键链路
  edges.push({s:"fa_03",t:"D_fa",type:"data"});
  edges.push({s:"co_01",t:"D_co",type:"data"});
  edges.push({s:"es_01",t:"D_es",type:"data"});
  edges.push({s:"cm_01",t:"D_cm",type:"data"});
  edges.push({s:"cb_01",t:"D_cb",type:"data"});

  // 绘制边
  const link = g.selectAll(".link").data(edges).enter().append("line")
    .attr("class",d=>"link"+(d.type==="platform"?" platform":""))
    .attr("x1",d=>idMap[d.s].fx).attr("y1",d=>idMap[d.s].fy)
    .attr("x2",d=>idMap[d.t].fx).attr("y2",d=>idMap[d.t].fy)
    .attr("stroke",d=>d.type==="data"?"#4A90D9":"#d8dde5");

  // 绘制节点
  const node = g.selectAll(".node").data(allNodes).enter().append("g")
    .attr("class","node")
    .attr("transform",d=>`translate(${d.fx},${d.fy})`)
    .on("mouseover",(e,d)=>{
      let html;
      if(d.slug.startsWith("D_")) html=`<div class="tt-title">${d.name}</div><div class="tt-sub">${d.count} 个模块 · ${d.families.length} 种技术</div>`;
      else if(d.slug.startsWith("P_")) html=`<div class="tt-title">${d.name}</div><div class="tt-sub">被 ${d.count} 个模块使用</div>`;
      else html=`<div class="tt-title">${d.name}</div><div class="tt-sub">${d.domain} · ${d.family}</div>`;
      showTip(html,e.clientX,e.clientY);
    })
    .on("mouseout",hideTip)
    .on("click",(e,d)=>{
      if(d.slug.startsWith("D_")){
        const dom = d.domain;
        state={level:"L1",domain:dom};
        breadcrumb=[breadcrumb[0],{label:dom,level:"L1",domain:dom}];
        render();
      } else if(d.slug.startsWith("P_")){
        showPlatformUsers(d.id, d.name);
      } else {
        navModule(d.slug);
      }
    });

  node.each(function(d){
    const sel = d3.select(this);
    if(d.slug.startsWith("D_")){
      // 业务域节点：大圆，显示域缩写+模块数
      sel.attr("class","node domain");
      sel.append("circle").attr("r",32).attr("fill",d.families[0]?("url(#grad_"+d.slug.slice(2)):"#444").attr("stroke","#fff3").attr("stroke-width",1.5);
      sel.append("text").attr("y",-2).text(d.name.slice(0,2)).style("font-size","13px").style("font-weight","700");
      sel.append("text").attr("y",14).text(d.count+"模块").style("font-size","10px").style("fill","var(--dim)");
      // 域名标签
      sel.append("text").attr("y",-42).text(d.name).style("font-size","11px");
    } else if(d.slug.startsWith("P_")){
      sel.attr("class","node platform");
      sel.append("circle").attr("r",26).attr("fill",d.color+"33").attr("stroke",d.color).attr("stroke-width",2);
      sel.append("text").attr("y",-2).text(d.name.slice(0,2)).style("font-weight","700").style("fill",d.color);
      sel.append("text").attr("y",14).text(d.count+"模块").style("font-size","9px").style("fill","var(--dim)");
      sel.append("text").attr("y",-34).text(d.name).style("font-size","10px");
    } else {
      // 基础层节点
      sel.append("circle").attr("r",22).attr("fill",d.color+"55").attr("stroke",d.color).attr("stroke-width",2);
      sel.append("text").attr("y",3).text(d.slug.toUpperCase().slice(0,5)).style("font-size","10px").style("font-weight","600");
      sel.append("text").attr("y",-30).text(d.name).style("font-size","10px");
    }
  });

  // 渐变定义
  const defs = svg.append("defs");
  domains.forEach(d=>{
    const mods = MODULES.filter(m=>m.domain===DOMAIN_NAME[d]);
    const grad = defs.append("linearGradient").attr("id","grad_"+d).attr("x1","0%").attr("y1","0%").attr("x2","100%").attr("y2","100%");
    mods.slice(0,3).forEach((m,i)=>grad.append("stop").attr("offset",i*33+"%").attr("stop-color",m.color));
  });
}

/* 显示平台使用方 */
function showPlatformUsers(pid, pname){
  const users = PLATFORM_EDGES.filter(([,p])=>p===pid).map(([s])=>M[s]);
  const byDomain = {};
  users.forEach(m=>{(byDomain[m.domain]=byDomain[m.domain]||[]).push(m);});
  let html = `<h3>${pname}</h3>
    <div class="info-row"><span class="k">使用方</span><span class="v">${users.length} 个模块</span></div>
    <p style="color:var(--dim);font-size:12px;margin:8px 0">点击模块进入详情</p>`;
  Object.entries(byDomain).forEach(([dom,mods])=>{
    html+=`<h3 style="margin-top:12px">${dom} (${mods.length})</h3><div class="dep-list">`;
    mods.forEach(m=>html+=`<div class="dep-item" onclick="navModule('${m.slug}')"><span style="color:${m.color}">●</span> ${m.name}</div>`);
    html+="</div>";
  });
  renderSidebar(html);
}

/* ======================= L1 业务域视图 ======================= */
function renderL1(){
  clearCanvas(); resetZoom();
  const dom = state.domain;
  const mods = MODULES.filter(m=>m.domain===dom);
  updateStats(`${dom} · ${mods.length} 模块`);
  renderLegend(null);
  renderSidebar(`<h3>${dom}</h3>
    <p style="color:var(--dim);font-size:13px;line-height:1.7">${mods.length} 个模块，涵盖 ${[...new Set(mods.map(m=>m.family))].length} 种技术家族。<br><br>
    点击<b>模块节点</b>查看内部结构。<br>虚线连接共享平台。</p>`);

  const slugs = mods.map(m=>m.slug);
  // 节点：模块 + 相关平台
  const platIds = [...new Set(PLATFORM_EDGES.filter(([s])=>slugs.includes(s)).map(([,p])=>p))];
  const platNodes = platIds.map(pid=>({...PLATFORMS.find(p=>p.id===pid), slug:pid}));
  const nodes = [...mods, ...platNodes];
  // 边
  const edges = [];
  DATA_EDGES.forEach(([s,t])=>{
    if(slugs.includes(s)&&slugs.includes(t)) edges.push({source:s,target:t,type:"data"});
  });
  PLATFORM_EDGES.forEach(([s,p])=>{
    if(slugs.includes(s)) edges.push({source:s,target:p,type:"platform"});
  });

  const sim = d3.forceSimulation(nodes)
    .force("charge",d3.forceManyBody().strength(d=>d.slug.startsWith("P_")?-400:-180))
    .force("center",d3.forceCenter(W/2,H/2))
    .force("collide",d3.forceCollide(d=>d.slug.startsWith("P_")?40:28))
    .force("link",d3.forceLink(edges).id(d=>d.slug)
      .distance(d=>d.type==="platform"?120:80).strength(0.3))
    .force("x",d3.forceX(W/2).strength(0.04))
    .force("y",d3.forceY(H/2).strength(0.04));

  const link = g.selectAll(".link").data(edges).enter().append("line")
    .attr("class",d=>"link"+(d.type==="platform"?" platform":""))
    .attr("stroke",d=>d.type==="data"?"#4A90D9":"#d8dde5");

  const node = g.selectAll(".node").data(nodes).enter().append("g")
    .attr("class","node")
    .on("mouseover",(e,d)=>{
      if(d.slug.startsWith("P_")) showTip(`<div class="tt-title">${d.name}</div><div class="tt-sub">共享平台 · ${d.count}模块</div>`,e.clientX,e.clientY);
      else showTip(`<div class="tt-title">${d.name}</div><div class="tt-sub">${d.slug.toUpperCase()} · ${d.family}<br>上游${DEP_MAP[d.slug].up.length} 下游${DEP_MAP[d.slug].down.length}</div>`,e.clientX,e.clientY);
    })
    .on("mouseout",hideTip)
    .on("click",(e,d)=>{
      if(d.slug.startsWith("P_")) showPlatformUsers(d.id,d.name);
      else navModule(d.slug);
    })
    .call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

  node.each(function(d){
    const sel=d3.select(this);
    if(d.slug.startsWith("P_")){
      sel.attr("class","node platform");
      sel.append("circle").attr("r",24).attr("fill",d.color+"33").attr("stroke",d.color).attr("stroke-width",2).attr("stroke-dasharray","4 2");
      sel.append("text").attr("y",3).text(d.name.slice(0,2)).style("font-size","11px").style("font-weight","700").style("fill",d.color);
      sel.append("text").attr("y",-32).text(d.name).style("font-size","10px");
    } else {
      const r = INFRA.includes(d.slug)?26:20;
      sel.append("circle").attr("r",r).attr("fill",d.color+"55").attr("stroke",d.color).attr("stroke-width",INFRA.includes(d.slug)?2.5:1.5);
      sel.append("text").attr("y",4).text(d.slug.toUpperCase().slice(3,5)).style("font-size","9px").style("font-weight","600");
      sel.append("text").attr("y",-r-6).text(d.name).style("font-size","10px");
      if(INFRA.includes(d.slug)) sel.append("text").attr("y",r+12).text("基础平台").style("font-size","9px").style("fill","var(--dim)");
    }
  });

  sim.on("tick",()=>{
    link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
        .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    node.attr("transform",d=>`translate(${d.x},${d.y})`);
  });
}

/* ======================= L2 模块详情视图 ======================= */
function renderL2(){
  clearCanvas(); resetZoom();
  const m = M[state.module];
  updateStats(`${m.name} · 模块结构`);
  moduleSidebar(m);

  const up = DEP_MAP[m.slug].up.map(s=>M[s]);
  const down = DEP_MAP[m.slug].down.map(s=>M[s]);
  const plats = PLATFORM_EDGES.filter(([s])=>s===m.slug).map(([,p])=>PLATFORMS.find(x=>x.id===p));

  const cx = W/2, cy = H/2;
  // 内部组件链（纵向）
  const comps = [
    {id:"engine",label:"engine.py",sub:m.engine,color:m.color,y:cy-120},
    {id:"pipeline",label:"pipeline.py",sub:"Pipeline",color:"#4A90D9",y:cy-60},
    {id:"custom",label:"custom/",sub:"业务规则",color:"#27AE60",y:cy},
    {id:"api",label:"api.py",sub:"FastAPI",color:"#E67E22",y:cy+60},
    {id:"main",label:"main.py",sub:"ASGI入口",color:"#9B59B6",y:cy+120}
  ];

  // 上游节点（左侧）
  const upNodes = up.map((u,i)=>({...u, x:cx-280, y:cy-120+i*50}));
  const downNodes = down.map((d,i)=>({...d, x:cx+280, y:cy-120+i*50}));
  const platNodes = plats.map((p,i)=>({...p, slug:p.id, x:cx, y:cy-220-i*40}));

  // 绘制上下游连线（含接口对应关系）
  const schema = NETWORK_SCHEMA[m.slug] || {inputs:[],outputs:[]};
  highlightedFlow = null;
  const edges = [];
  upNodes.forEach(u=>{
    const iface = (schema.inputs||[]).find(i=>i.module===u.slug) || null;
    edges.push({x1:u.x+20,y1:u.y,x2:cx-60,y2:cy-120,type:"data",iface:iface,dir:"up",peer:u.slug});
  });
  downNodes.forEach(d=>{
    const iface = (schema.outputs||[]).find(o=>o.module===d.slug) || null;
    edges.push({x1:cx+60,y1:cy+120,x2:d.x-20,y2:d.y,type:"data",iface:iface,dir:"down",peer:d.slug});
  });
  platNodes.forEach(p=>edges.push({x1:p.x,y1:p.y+15,x2:cx,y2:cy-60,type:"platform"}));

  g.selectAll(".link").data(edges).enter().append("line")
    .attr("class",d=>"link"+(d.type==="platform"?" platform":"")+(d.iface?" iface-link":""))
    .attr("x1",d=>d.x1).attr("y1",d=>d.y1).attr("x2",d=>d.x2).attr("y2",d=>d.y2)
    .attr("stroke",d=>{
      if(d.type==="platform") return "#27AE60";
      if(d.iface) return FORMAT_COLOR[d.iface.format] || "#4A90D9";
      return "#4A90D9";
    })
    .attr("stroke-width",d=>d.iface?1.8:1.2)
    .attr("marker-end","url(#arrow)")
    .style("cursor",d=>d.iface?"pointer":"default")
    .on("mouseover",function(e,d){
      if(d.iface){
        const peerName = M[d.peer]?M[d.peer].name:d.peer;
        const dirTxt = d.dir==="up"?"来自":"流向";
        const fields = (d.iface.fields||[]).join("、");
        showTip(`<div class="tt-title">${d.iface.data_type||""} <span style="color:${FORMAT_COLOR[d.iface.format]||'#4A90D9'}">[${d.iface.format||""}]</span></div><div class="tt-sub">${dirTxt} ${peerName}<br>${d.iface.description||""}<br><b>字段:</b> ${fields}</div>`,e.clientX,e.clientY);
      }
    })
    .on("mouseout",hideTip)
    .on("click",function(e,d){ if(d.iface){ e.stopPropagation(); highlightFlow(d.peer,d.dir); } });

  // 接口标签（data_type 标注在连线中点，颜色区分数据格式）
  const dataEdges = edges.filter(e=>e.iface);
  const ifaceLabels = g.selectAll(".iface-label").data(dataEdges).enter().append("g")
    .attr("class","iface-label")
    .attr("transform",d=>`translate(${(d.x1+d.x2)/2},${(d.y1+d.y2)/2})`)
    .style("cursor","pointer")
    .on("mouseover",function(e,d){
      const peerName = M[d.peer]?M[d.peer].name:d.peer;
      const dirTxt = d.dir==="up"?"来自":"流向";
      const fields = (d.iface.fields||[]).join("、");
      showTip(`<div class="tt-title">${d.iface.data_type||""} <span style="color:${FORMAT_COLOR[d.iface.format]||'#4A90D9'}">[${d.iface.format||""}]</span></div><div class="tt-sub">${dirTxt} ${peerName}<br>${d.iface.description||""}<br><b>字段:</b> ${fields}</div>`,e.clientX,e.clientY);
    })
    .on("mouseout",hideTip)
    .on("click",function(e,d){ e.stopPropagation(); highlightFlow(d.peer,d.dir); });
  ifaceLabels.append("rect")
    .attr("x",-50).attr("y",-8).attr("width",100).attr("height",16).attr("rx",8)
    .attr("fill",d=>(FORMAT_COLOR[d.iface.format]||"#4A90D9")+"22")
    .attr("stroke",d=>FORMAT_COLOR[d.iface.format]||"#4A90D9")
    .attr("stroke-width",0.8);
  ifaceLabels.append("text").attr("y",3).attr("text-anchor","middle")
    .text(d=>shortLabel(d.iface.data_type,10))
    .style("font-size","9px")
    .style("fill",d=>FORMAT_COLOR[d.iface.format]||"#4A90D9")
    .style("font-weight","600")
    .style("pointer-events","none");

  // 箭头
  const defs = svg.append("defs");
  defs.append("marker").attr("id","arrow").attr("viewBox","0 -5 10 10")
    .attr("refX",8).attr("refY",0).attr("markerWidth",6).attr("markerHeight",6)
    .attr("orient","auto").append("path").attr("d","M0,-5L10,0L0,5").attr("fill","#4A90D9");

  // 内部组件节点
  const compG = g.selectAll(".comp-node").data(comps).enter().append("g")
    .attr("class","comp-node")
    .attr("transform",d=>`translate(${cx},${d.y})`)
    .on("click",(e,d)=>{drillComponent(m.slug,d.label);})
    .on("mouseover",(e,d)=>showTip(`<div class="tt-title">${d.label}</div><div class="tt-sub">${d.sub} · 点击查看详情</div>`,e.clientX,e.clientY))
    .on("mouseout",hideTip);
  compG.append("rect").attr("x",-60).attr("y",-16).attr("width",120).attr("height",32)
    .attr("rx",6).attr("fill",d=>d.color+"33").attr("stroke",d=>d.color).attr("stroke-width",1.5);
  compG.append("text").attr("y",-1).text(d=>d.label).style("font-size","12px").style("font-weight","600");
  compG.append("text").attr("y",11).text(d=>d.sub).style("font-size","9px").style("fill","var(--dim)");
  // 组件间连线
  for(let i=0;i<comps.length-1;i++){
    g.append("line").attr("class","link highlight")
      .attr("x1",cx).attr("y1",comps[i].y+16).attr("x2",cx).attr("y2",comps[i+1].y-16)
      .attr("stroke","#4A90D9").attr("stroke-width",2).attr("marker-end","url(#arrow)");
  }

  // 上游节点
  const upG = g.selectAll(".up-node").data(upNodes).enter().append("g")
    .attr("class","node").attr("transform",d=>`translate(${d.x},${d.y})`)
    .on("click",(e,d)=>navModule(d.slug))
    .on("mouseover",(e,d)=>showTip(`<div class="tt-title">${d.name}</div><div class="tt-sub">${d.slug.toUpperCase()} · 上游</div>`,e.clientX,e.clientY))
    .on("mouseout",hideTip);
  upG.append("circle").attr("r",14).attr("fill",d=>d.color+"55").attr("stroke",d=>d.color);
  upG.append("text").attr("y",3).text(d=>d.slug.toUpperCase().slice(3,5)).style("font-size","8px");
  upG.append("text").attr("x",-20).attr("y",3).attr("text-anchor","end").text(d=>d.name).style("font-size","10px");
  upG.append("text").attr("x",-20).attr("y",-6).attr("text-anchor","end").text("上游").style("font-size","9px").style("fill","var(--dim)");

  // 下游节点
  const dnG = g.selectAll(".dn-node").data(downNodes).enter().append("g")
    .attr("class","node").attr("transform",d=>`translate(${d.x},${d.y})`)
    .on("click",(e,d)=>navModule(d.slug));
  dnG.append("circle").attr("r",14).attr("fill",d=>d.color+"55").attr("stroke",d=>d.color);
  dnG.append("text").attr("y",3).text(d=>d.slug.toUpperCase().slice(3,5)).style("font-size","8px");
  dnG.append("text").attr("x",20).attr("y",3).text(d=>d.name).style("font-size","10px");
  dnG.append("text").attr("x",20).attr("y",-6).text("下游").style("font-size","9px").style("fill","var(--dim)");

  // 平台节点
  const plG = g.selectAll(".pl-node").data(platNodes).enter().append("g")
    .attr("class","node platform").attr("transform",d=>`translate(${d.x},${d.y})`)
    .on("click",(e,d)=>showPlatformUsers(d.id,d.name));
  plG.append("circle").attr("r",12).attr("fill",d=>d.color+"33").attr("stroke",d=>d.color).attr("stroke-dasharray","3 2");
  plG.append("text").attr("y",-16).text(d=>d.name).style("font-size","9px");

  // 标题
  g.append("text").attr("x",cx).attr("y",40).attr("text-anchor","middle")
    .text(m.name).style("font-size","18px").style("font-weight","700").style("fill",m.color);
  g.append("text").attr("x",cx).attr("y",60).attr("text-anchor","middle")
    .text(`${m.slug.toUpperCase()} · ${m.family} · ${m.domain}`).style("font-size","12px").style("fill","var(--dim)");
  fitContent(80);
}

/* ======================= L3 实现细节 ======================= */
function renderL3(){
  clearCanvas(); resetZoom();
  const m = M[state.module];
  const comp = state.comp;
  updateStats(`${m.name} · ${comp}`);

  const details = {
    "engine.py":{title:"核心算法引擎",items:[
      ["引擎类",m.engine],["技术家族",m.family],
      ["基类","AbstractEngine（模板方法：_load_model→_preprocess→_infer→_postprocess）"],
      ["execute()","不可覆盖的入口，串联四阶段"],
      ["setup()","加载模型/规则/知识库到 self.model"],
      ["close()","关闭 PortableDB 连接（若有）"]
    ]},
    "pipeline.py":{title:"四阶段编排",items:[
      ["类名","Pipeline"],"__init__","接收 config，实例化 engine + custom_*",
      "run(input)","入口：setup()→engine.execute()→format_output()",
      "custom_thresholds","阈值检查","custom_rules","业务规则校验",
      "custom_formatter","输出格式化"
    ]},
    "custom/":{title:"业务规则层",items:[
      ["custom_thresholds.py","阈值配置（可覆盖默认值）"],
      ["custom_rules.py","业务校验规则"],
      ["custom_formatter.py","输出格式化与标记（family/module）"]
    ]},
    "api.py":{title:"FastAPI 路由",items:[
      ["GET /health","健康检查"],["GET /info","模块元信息"],
      ["POST /execute","执行引擎（接收 input_data）"],
      ["框架","FastAPI + Pydantic"]
    ]},
    "main.py":{title:"ASGI 入口",items:[
      ["app","FastAPI 实例"],["router","挂载 api.py 路由"],
      ["启动","uvicorn modules.<slug>.main:app"]
    ]},
    "tests/":{title:"测试套件",items:[
      ["test_engine.py","引擎核心行为测试"],
      ["test_pipeline.py","Pipeline 端到端测试"],
      ["test_api.py","API health/info 测试"],
      ["fixtures/","sample_input.json + expected_output.json"],
      ["框架","pytest + tmp_path 隔离"]
    ]}
  };
  const d = details[comp]||{title:comp,items:[]};
  let html = `<h3>${m.name} · ${d.title}</h3>`;
  d.items.forEach((it)=>{
    if(typeof it==="string") html+=`<div class="info-row"><span class="k">${it}</span><span class="v"></span></div>`;
    else html+=`<div class="info-row"><span class="k">${it[0]}</span><span class="v">${it[1]}</span></div>`;
  });
  html+=`<div class="detail-card" style="margin-top:16px"><div class="dc-title">📁 文件位置</div><div class="dc-content">modules/${m.slug}/${comp}</div></div>`;
  html+=`<div class="detail-card"><div class="dc-title">🔗 上下游</div><div class="dc-content">上游 ${DEP_MAP[m.slug].up.length} · 下游 ${DEP_MAP[m.slug].down.length}<br>共享平台 ${PLATFORM_EDGES.filter(([s])=>s===m.slug).length} 个</div></div>`;
  renderSidebar(html);

  // 画布显示结构图
  const cx=W/2, cy=H/2;
  g.append("text").attr("x",cx).attr("y",cy-100).attr("text-anchor","middle")
    .text(comp).style("font-size","22px").style("font-weight","700").style("fill",m.color);
  g.append("text").attr("x",cx).attr("y",cy-70).attr("text-anchor","middle")
    .text(`${m.name} · ${d.title}`).style("font-size","14px").style("fill","var(--dim)");

  // 展示组件的子结构
  const subItems = d.items.filter(it=>Array.isArray(it));
  const subG = g.selectAll(".sub").data(subItems).enter().append("g")
    .attr("class","node comp-node")
    .attr("transform",(d,i)=>`translate(${cx-140+(i%2)*280}, ${cy-20+Math.floor(i/2)*60})`);
  subG.append("rect").attr("x",-120).attr("y",-20).attr("width",240).attr("height",40).attr("rx",8)
    .attr("fill",m.color+"15").attr("stroke",m.color).attr("stroke-width",1);
  subG.append("text").attr("y",-4).text(d=>d[0]).style("font-size","13px").style("font-weight","600");
  subG.append("text").attr("y",11).text(d=>String(d[1]).slice(0,30)).style("font-size","10px").style("fill","var(--dim)");
  fitContent(80);
}

/* ======================= 主渲染 ======================= */
function render(){
  renderBreadcrumb();
  if(state.level==="L0") renderL0();
  else if(state.level==="L1") renderL1();
  else if(state.level==="L2") renderL2();
  else if(state.level==="L3") renderL3();
}

// 读取 URL hash 自动跳转到指定模块
const hashMatch = location.hash.match(/module=([\w_]+)/);
if(hashMatch && M[hashMatch[1]]){
  navModule(hashMatch[1]);
} else {
  render();
}
</script>
</body>
</html>
