<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审计智能化平台 · 电子云星系</title>
<style>
  :root{
    --bg:#ffffff; --text:#1a1d29; --dim:#6c757d; --accent:#4A90D9;

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  #app{position:relative;width:100%;height:100%}
  canvas{position:absolute;inset:0;display:block}
  #bg-canvas{z-index:0}
  #main-canvas{z-index:1;cursor:crosshair}

  /* 顶部 */
  #topbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;pointer-events:none}
  #topbar .brand{pointer-events:none}
  #topbar .title{font-size:20px;font-weight:800;background:linear-gradient(90deg,#4A90D9,#27AE60,#E67E22);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
  #topbar .sub{font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:3px}
  #topbar .controls{display:flex;gap:10px;pointer-events:auto}
  .btn{background:rgba(248,249,250,.6);border:1px solid #e9ecef;border-radius:8px;padding:7px 14px;font-size:12px;color:var(--dim);cursor:pointer;transition:.2s;backdrop-filter:blur(8px);user-select:none}
  .btn:hover{border-color:var(--accent);color:var(--text);box-shadow:0 0 10px rgba(74,144,217,.25)}
  .btn.on{background:rgba(74,144,217,.12);border-color:var(--accent);color:var(--accent)}

  /* HUD */
  #hud{position:absolute;top:70px;left:28px;z-index:10;pointer-events:none;display:flex;gap:12px}
  .stat{background:rgba(248,249,250,.65);border:1px solid #e9ecef;border-radius:6px;padding:7px 14px;font-size:12px;backdrop-filter:blur(8px)}
  .stat .n{font-size:18px;font-weight:700;color:var(--accent)}
  .stat .l{color:var(--dim);font-size:10px;margin-left:4px}

  /* 图例 */
  #legend{position:absolute;bottom:24px;left:28px;z-index:10;background:rgba(248,249,250,.75);border:1px solid #e9ecef;border-radius:10px;padding:13px 16px;backdrop-filter:blur(10px)}
  #legend .lt{font-size:10px;color:var(--dim);margin-bottom:8px;letter-spacing:1px;text-transform:uppercase}
  .lr{display:flex;align-items:center;gap:8px;padding:2px 0}
  .ld{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}

  /* 提示 */
  #hint{position:absolute;bottom:24px;right:28px;z-index:10;background:rgba(74,144,217,.08);border:1px solid var(--accent);border-radius:20px;padding:7px 16px;font-size:11px;color:var(--accent);backdrop-filter:blur(8px)}

  /* tooltip */
  #tip{position:absolute;pointer-events:none;background:rgba(248,249,250,.95);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:12px;max-width:260px;z-index:100;opacity:0;transition:opacity .12s;box-shadow:0 4px 20px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
  #tip .tt{font-weight:700;font-size:13px;margin-bottom:3px}
  #tip .ts{color:var(--dim);line-height:1.5}
  #tip .td{margin-top:4px;padding-top:4px;border-top:1px solid #e9ecef;color:var(--dim);font-size:11px}

  /* 面板 */
  #panel{position:absolute;top:0;right:0;bottom:0;width:360px;background:rgba(248,249,250,.93);border-left:1px solid #e9ecef;z-index:20;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(16px);overflow-y:auto;padding:20px}
  #panel.open{transform:translateX(0)}
  #panel .close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;background:#e9ecef;border:none;color:var(--dim);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.15s}
  #panel .close:hover{background:#dfe3ea;color:var(--text)}
  #panel h2{font-size:18px;font-weight:700;margin-bottom:4px;line-height:1.3}
  #panel .slug{font-size:12px;color:var(--dim);margin-bottom:14px;font-family:monospace}
  #panel .st{font-size:11px;color:var(--accent);margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid #e9ecef;letter-spacing:1px;text-transform:uppercase}
  #panel .row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
  #panel .row .k{color:var(--dim)}
  #panel .row .v{color:var(--text);font-weight:500;text-align:right}
  #panel .di{padding:6px 10px;margin:3px 0;background:rgba(241,243,245,.6);border-radius:6px;font-size:12px;cursor:pointer;transition:.15s;border-left:2px solid transparent}
  #panel .di:hover{background:rgba(222,226,230,.7);border-left-color:var(--accent)}
  #panel .eb{display:block;width:100%;margin-top:16px;padding:10px;background:linear-gradient(135deg,var(--accent),#27AE60);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:.2s}
  #panel .eb:hover{filter:brightness(1.2);box-shadow:0 4px 14px rgba(74,144,217,.35)}

  /* loader */
  #loader{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .6s}

  /* 模态层 */
  #modal{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:rgba(255,255,255,.85);backdrop-filter:blur(6px)}
  #modal.open{display:flex}
  #modal-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(248,249,250,.95);border-bottom:1px solid #e9ecef}
  #modal-title{font-size:15px;font-weight:700;color:var(--text)}
  #modal-close{width:32px;height:32px;border-radius:50%;background:#e9ecef;border:none;color:var(--dim);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.15s}
  #modal-close:hover{background:#dfe3ea;color:var(--text)}
  #modal-body{flex:1;overflow-y:auto;padding:24px 28px}
  #modal-body .mb-head{margin-bottom:20px}
  #modal-body .mb-title{font-size:24px;font-weight:800;line-height:1.3}
  #modal-body .mb-slug{font-size:13px;color:var(--dim);margin-top:4px;font-family:monospace;letter-spacing:1px}
  #modal-body .mb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:24px}
  #modal-body .mb-card{background:rgba(241,243,245,.6);border:1px solid #e9ecef;border-radius:8px;padding:12px 14px}
  #modal-body .mb-card .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
  #modal-body .mb-card .v{font-size:14px;color:var(--text);font-weight:600}
  #modal-body .mb-section{margin-bottom:24px}
  #modal-body .mb-section-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #e9ecef;letter-spacing:1px;text-transform:uppercase}
  #modal-body .mb-dep-item{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:4px 0;background:rgba(241,243,245,.5);border-radius:6px;cursor:pointer;transition:.15s;border-left:2px solid transparent}
  #modal-body .mb-dep-item:hover{background:rgba(222,226,230,.7);border-left-color:var(--accent)}
  #modal-body .mb-dep-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  #modal-body .mb-dep-item .arrow{color:var(--dim);font-size:12px;margin:0 4px}
  #modal-body .mb-open-btn{display:inline-block;margin-top:8px;padding:10px 20px;background:linear-gradient(135deg,var(--accent),#27AE60);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:.2s}
  #modal-body .mb-open-btn:hover{filter:brightness(1.2);box-shadow:0 4px 14px rgba(74,144,217,.35)}
  #modal-body .mb-graph{width:100%;min-height:180px;background:rgba(248,249,250,.4);border:1px solid #e9ecef;border-radius:10px;margin-bottom:16px}
  #modal-body .mb-iface{padding:10px 12px;margin:4px 0;background:rgba(241,243,245,.6);border-radius:8px;border-left:3px solid var(--accent)}
  #modal-body .mb-iface-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
  #modal-body .mb-iface-module{font-size:13px;font-weight:600;cursor:pointer;color:var(--accent)}
  #modal-body .mb-iface-module:hover{text-decoration:underline}
  #modal-body .mb-iface-type{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff}
  #modal-body .mb-iface-fmt{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid #e9ecef;color:var(--dim)}
  #modal-body .mb-iface-desc{font-size:11px;color:var(--dim);line-height:1.5;margin:4px 0}
  #modal-body .mb-iface-fields{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
  #modal-body .mb-iface-field{font-size:10px;padding:1px 6px;background:rgba(74,144,217,.1);border-radius:4px;color:var(--accent);font-family:monospace}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .sp{width:44px;height:44px;border:2px solid #e9ecef;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
  #loader .tx{font-size:12px;color:var(--dim);letter-spacing:2px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

function renderIface(iface,dir){

  let h='<div class="mb-iface">'+
    '<div class="mb-iface-head">'+
      '<span class="mb-iface-module"'+click+' style="'+(isExt?'cursor:default;color:var(--dim);':'')+'">'+arrow+' '+modName+'</span>'+

function drawBg(t){
  bgX.fillStyle='#ffffff';
  bgX.fillRect(0,0,W,H);
  // 中心微光
  const cg=bgX.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.5);
  cg.addColorStop(0,'rgba(100,140,200,0.08)');
  cg.addColorStop(1,'rgba(255,255,255,0)');
  bgX.fillStyle=cg;
  bgX.fillRect(0,0,W,H);
  bgStars.forEach(s=>{
    const o=Math.abs(Math.sin(t*s.s)*s.o)+0.05;
    bgX.beginPath();
    bgX.arc(s.x,s.y,s.r,0,Math.PI*2);
    bgX.fillStyle=`rgba(120,130,160,${o*1.5})`;
    bgX.fill();
  });
}

/* ======================= 视图变换（缩放/平移） ======================= */
const view = {scale:1, ox:0, oy:0};

/* ======================= 鼠标 ======================= */
let mouse={x:-9999,y:-9999,active:false};
let hoverNode=null;
let dragging=false, dragStart=null, dragMoved=false;

function screenToWorld(sx,sy){ return {x:(sx-view.ox)/view.scale, y:(sy-view.oy)/view.scale}; }

mC.addEventListener('mousedown',e=>{
  // 空白处拖拽平移（左键无节点时 / 右键 / 中键）
  if(e.button===1 || e.button===2 || (e.button===0 && !hoverNode)){
    dragging=true; dragMoved=false;
    dragStart={x:e.clientX-view.ox, y:e.clientY-view.oy};
    mC.style.cursor='grabbing';
    e.preventDefault();
  }
});

mC.addEventListener('mousemove',e=>{
  const r=mC.getBoundingClientRect();
  const sx=e.clientX-r.left, sy=e.clientY-r.top;
  // 拖拽平移
  if(dragging){
    view.ox = sx - dragStart.x;
    view.oy = sy - dragStart.y;
    dragMoved=true;
    return;
  }
  // 屏幕坐标 → 世界坐标
  const w = screenToWorld(sx, sy);
  mouse.x=w.x; mouse.y=w.y; mouse.active=true;
  // hit test（世界坐标系）
  let nearest=null,nd=999;
  for(const n of nodes){
    const d=Math.hypot(n.x-mouse.x,n.y-mouse.y);
    const hitR=(n.r+10)/view.scale; // 缩放后命中范围自适应
    if(d<hitR && d<nd){nd=d;nearest=n;}
  }
  if(nearest!==hoverNode){
    hoverNode=nearest;
    mC.style.cursor=nearest?'pointer':'crosshair';
    if(nearest){
      const up=DEP[nearest.slug].up,down=DEP[nearest.slug].down;
      tip.innerHTML=`<div class="tt" style="color:${nearest.color}">${nearest.name}</div><div class="ts">${nearest.slug.toUpperCase()} · ${nearest.domain}<br>${nearest.family} · ${nearest.engine}<br>${nearest.layer}</div>${up.length||down.length?`<div class="td">↑ 上游 ${up.length} · ↓ 下游 ${down.length}</div>`:""}`;
      tip.style.opacity=1;
    } else { tip.style.opacity=0; }
  }
  if(nearest){ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px'; }
});

mC.addEventListener('mouseup',()=>{
  if(dragging){dragging=false; mC.style.cursor=hoverNode?'pointer':'crosshair';}
});
mC.addEventListener('mouseleave',()=>{mouse.active=false;mouse.x=-9999;mouse.y=-9999;hoverNode=null;tip.style.opacity=0;dragging=false;mC.style.cursor='crosshair';});

// 点击（拖拽后不触发）
mC.addEventListener('click',e=>{
  if(dragMoved){dragMoved=false; return;}
  if(hoverNode) openPanel(hoverNode);
});

// 滚轮缩放（以鼠标为中心）
mC.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=mC.getBoundingClientRect();
  const sx=e.clientX-r.left, sy=e.clientY-r.top;
  const w=screenToWorld(sx,sy);
  const delta = e.deltaY<0 ? 1.15 : 1/1.15;
  view.scale = Math.max(0.3, Math.min(6, view.scale*delta));
  // 保持鼠标位置不变：sx = w.x*scale + ox
  view.ox = sx - w.x*view.scale;
  view.oy = sy - w.y*view.scale;
}, {passive:false});

/* ======================= 物理模拟 ======================= */
function physics(){
  for(const n of nodes){
    // 中心微弱引力
    const dxc=cx0-n.x, dyc=cy0-n.y;
    const dc=Math.hypot(dxc,dyc)||1;
    const pull=Math.min(dc,600)*0.000015;
    n.vx+=dxc/dc*pull; n.vy+=dyc/dc*pull;
    // 鼠标引力
    if(sw.attract&&mouse.active){
      const dxm=mouse.x-n.x, dym=mouse.y-n.y;
      const dm=Math.hypot(dxm,dym)||1;
      if(dm<200){
        const f=(1-dm/200)*0.08;
        n.vx+=dxm/dm*f; n.vy+=dym/dm*f;
      }
    }
    // 微扰
    n.vx+=(Math.random()-0.5)*0.04;
    n.vy+=(Math.random()-0.5)*0.04;
    // 阻尼
    n.vx*=0.97; n.vy*=0.97;
    // 限速
    const sp=Math.hypot(n.vx,n.vy);
    if(sp>0.8){n.vx=n.vx/sp*0.8;n.vy=n.vy/sp*0.8;}
    n.x+=n.vx; n.y+=n.vy;
    // 边界
    const pad=40;
    if(n.x<pad){n.x=pad;n.vx*=-0.5;} if(n.x>W-pad){n.x=W-pad;n.vx*=-0.5;}
    if(n.y<pad){n.y=pad;n.vy*=-0.5;} if(n.y>H-pad){n.y=H-pad;n.vy*=-0.5;}
  }
  // 排斥
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];
      const dx=b.x-a.x,dy=b.y-a.y;
      const d=Math.hypot(dx,dy)||1;
      const minD=(a.r+b.r+18);
      if(d<minD){
        const f=(minD-d)/minD*0.15;
        a.vx-=dx/d*f; a.vy-=dy/d*f;
        b.vx+=dx/d*f; b.vy+=dy/d*f;
      }
    }
  }
}

/* ======================= 渲染 ======================= */
function render(t){
  mx.clearRect(0,0,W,H);
  // 应用缩放/平移变换（背景星空不受影响，在 drawBg 中绘制）
  mx.save();
  mx.translate(view.ox, view.oy);
  mx.scale(view.scale, view.scale);

  // 1. 电子云连线（距离阈值）
  if(sw.cloud){
    const TH=150;
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i],b=nodes[j];
        const dx=b.x-a.x,dy=b.y-a.y;
        const d=Math.hypot(dx,dy);
        if(d<TH){
          const op=(1-d/TH);
          const isHover=(hoverNode&&(a===hoverNode||b===hoverNode));
          const boost=isHover?3:1;
          // 混合两节点颜色
          mx.strokeStyle=hexA(a.color, op*0.25*boost);
          mx.lineWidth=isHover?1:0.5;
          mx.beginPath();
          mx.moveTo(a.x,a.y);
          mx.lineTo(b.x,b.y);
          mx.stroke();
        }
      }
    }
  }

  // 2. 依赖连线
  if(sw.dep){
    DATA_EDGES.forEach(([s,tk])=>{
      const a=M[s]?nodes.find(n=>n.slug===s):null;
      const b=M[tk]?nodes.find(n=>n.slug===tk):null;
      if(!a||!b) return;
      const isHover=(hoverNode&&(a.slug===hoverNode.slug||b.slug===hoverNode.slug));
      mx.strokeStyle=hexA(a.color, isHover?0.6:0.3);
      mx.lineWidth=isHover?1.5:0.8;
      mx.beginPath();
      mx.moveTo(a.x,a.y);
      // 微弯曲线
      const mxp=(a.x+b.x)/2, myp=(a.y+b.y)/2;
      const dx=b.x-a.x,dy=b.y-a.y;
      const dl=Math.hypot(dx,dy)||1;
      const cv=20;
      mx.quadraticCurveTo(mxp-dy/dl*cv, myp+dx/dl*cv, b.x, b.y);
      mx.stroke();
    });
  }

  // 3. 数据流粒子
  if(sw.flow){
    flows.forEach(f=>{
      f.p+=f.sp; if(f.p>1)f.p-=1;
      const a=nodes.find(n=>n.slug===f.s);
      const b=nodes.find(n=>n.slug===f.t);
      if(!a||!b) return;
      const mxp=(a.x+b.x)/2, myp=(a.y+b.y)/2;
      const dx=b.x-a.x,dy=b.y-a.y;
      const dl=Math.hypot(dx,dy)||1;
      const cv=20;
      const cpx=mxp-dy/dl*cv, cpy=myp+dx/dl*cv;
      const tt=f.p;
      const x=(1-tt)*(1-tt)*a.x+2*(1-tt)*tt*cpx+tt*tt*b.x;
      const y=(1-tt)*(1-tt)*a.y+2*(1-tt)*tt*cpy+tt*tt*b.y;
      const sz=2+Math.sin(tt*Math.PI)*2;
      // 拖尾
      for(let k=0;k<5;k++){
        const tk=Math.max(0,tt-k*0.03);
        const tx=(1-tk)*(1-tk)*a.x+2*(1-tk)*tk*cpx+tk*tk*b.x;
        const ty=(1-tk)*(1-tk)*a.y+2*(1-tk)*tk*cpy+tk*tk*b.y;
        mx.beginPath();
        mx.arc(tx,ty,sz*(1-k*0.18),0,Math.PI*2);
        mx.fillStyle=hexA(f.color, Math.sin(tk*Math.PI)*0.6*(1-k*0.2));
        mx.fill();
      }
      // 头部光点
      mx.beginPath();
      mx.arc(x,y,sz,0,Math.PI*2);
      mx.fillStyle=hexA(f.color, Math.sin(tt*Math.PI)*0.9);
      mx.fill();
      // data_type 标注（连线中点）
      var iface=findFlowIface(f.s,f.t);
      if(iface){
        var mlx=0.25*a.x+0.5*cpx+0.25*b.x;
        var mly=0.25*a.y+0.5*cpy+0.25*b.y;
        mx.font='9px "PingFang SC",sans-serif';
        mx.textAlign='center';
        mx.textBaseline='middle';
        mx.fillStyle=hexA(f.color,0.5);
        mx.fillText(iface.data_type, mlx, mly);
        mx.textBaseline='alphabetic';
      }
    });
  }

  // 4. 节点
  for(const n of nodes){
    const breath=Math.sin(t*0.002+n.phase)*0.25+1;
    const isHover=(hoverNode===n);
    const r=n.baseR*breath*(isHover?1.8:1);
    // 外发光
    const g=mx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*5);
    g.addColorStop(0,hexA(n.color, isHover?0.8:0.5));
    g.addColorStop(0.4,hexA(n.color, isHover?0.3:0.25));
    g.addColorStop(1,hexA(n.color,0));
    mx.fillStyle=g;
    mx.beginPath();
    mx.arc(n.x,n.y,r*5,0,Math.PI*2);
    mx.fill();
    // 实心核
    mx.fillStyle=n.color;
    mx.beginPath();
    mx.arc(n.x,n.y,r,0,Math.PI*2);
    mx.fill();
    // 内高光
    mx.fillStyle='rgba(255,255,255,0.6)';
    mx.beginPath();
    mx.arc(n.x-r*0.2,n.y-r*0.2,r*0.35,0,Math.PI*2);
    mx.fill();
    // 基础平台层外环
    if(n.isInfra){
      mx.strokeStyle=hexA(n.color,0.6);
      mx.lineWidth=1.5;
      mx.beginPath();
      mx.arc(n.x,n.y,r+4,0,Math.PI*2);
      mx.stroke();
    }
    // hover 环
    if(isHover){
      mx.strokeStyle=hexA(n.color,0.8);
      mx.lineWidth=2;
      mx.beginPath();
      mx.arc(n.x,n.y,r+8+Math.sin(t*0.005)*3,0,Math.PI*2);
      mx.stroke();
    }
    // 标签
    if(sw.label||isHover){
      mx.font='11px "PingFang SC",sans-serif';
      mx.fillStyle=isHover?'#1a1d29':'#6c757d';
      mx.textAlign='center';
      mx.fillText(n.slug.toUpperCase().slice(3,5), n.x, n.y+r+14);
      if(isHover){
        mx.font='12px "PingFang SC",sans-serif';
        mx.fillStyle=n.color;
        mx.fillText(n.name, n.x, n.y-r-12);
      }
    }
  }
  mx.restore();
}

/* ======================= 面板 ======================= */
function openPanel(m){
  const up=DEP[m.slug].up,down=DEP[m.slug].down;
  let h=`<h2 style="color:${m.color}">${m.name}</h2><div class="slug">${m.slug.toUpperCase()} · ${m.engine}</div>
    <div class="row"><span class="k">业务域</span><span class="v">${m.domain}</span></div>
    <div class="row"><span class="k">技术家族</span><span class="v">${m.family}</span></div>
    <div class="row"><span class="k">架构层</span><span class="v">${m.layer}</span></div>
    <div class="row"><span class="k">上游</span><span class="v">${up.length}</span></div>
    <div class="row"><span class="k">下游</span><span class="v">${down.length}</span></div>`;
  if(up.length){h+=`<div class="st">上游依赖</div>`;up.forEach(s=>h+=`<div class="di" onclick="openPanel(M['${s}'])"><span style="color:${M[s].color}">●</span> ${M[s].name}</div>`);}
  if(down.length){h+=`<div class="st">下游被依赖</div>`;down.forEach(s=>h+=`<div class="di" onclick="openPanel(M['${s}'])"><span style="color:${M[s].color}">●</span> ${M[s].name}</div>`);}
  h+=`<button class="eb" onclick="openModal('${m.slug}')">进入知识图谱详情 →</button>`;
  document.getElementById('panel-content').innerHTML=h;
  document.getElementById('panel').classList.add('open');
}
window.openPanel=openPanel;
window.M=M;
window.closePanel=()=>document.getElementById('panel').classList.remove('open');

/* ======================= 模态层（知识图谱详情） ======================= */
window.openModal=function(slug){
  const m = slug ? M[slug] : null;
  if(!m){ return; }
  document.getElementById('modal-title').textContent = m.name + ' · 知识图谱详情';
  const up = DEP[m.slug].up, down = DEP[m.slug].down;
  const body = document.getElementById('modal-body');

  // 基本信息
  let html = '<div class="mb-head">'+
    '<div class="mb-title" style="color:'+m.color+'">'+m.name+'</div>'+
    '<div class="mb-slug">'+m.slug.toUpperCase()+' · '+m.engine+'</div>'+
  '</div>';

  html += '<div class="mb-grid">'+
    '<div class="mb-card"><div class="k">业务域</div><div class="v">'+m.domain+'</div></div>'+
    '<div class="mb-card"><div class="k">技术家族</div><div class="v">'+m.family+'</div></div>'+
    '<div class="mb-card"><div class="k">引擎类</div><div class="v">'+m.engine+'</div></div>'+
    '<div class="mb-card"><div class="k">架构层</div><div class="v">'+m.layer+'</div></div>'+
    '<div class="mb-card"><div class="k">上游依赖</div><div class="v">'+up.length+' 个</div></div>'+
    '<div class="mb-card"><div class="k">下游被依赖</div><div class="v">'+down.length+' 个</div></div>'+
  '</div>';

  // 依赖关系图谱（SVG 手绘）
  html += '<div class="mb-section">'+
    '<div class="mb-section-title">依赖关系图谱</div>'+
    '<svg class="mb-graph" id="dep-graph"></svg>'+
  '</div>';

  // 上游依赖列表
  if(up.length){
    html += '<div class="mb-section"><div class="mb-section-title">上游依赖</div>';
    up.forEach(function(s){
      html += '<div class="mb-dep-item" onclick="openModal(\''+s+'\')">'+
        '<span class="dot" style="background:'+M[s].color+'"></span>'+
        '<span>'+M[s].name+'</span>'+
        '<span class="arrow">→</span>'+
        '<span style="color:var(--dim);font-size:11px">'+M[s].slug.toUpperCase()+'</span>'+
      '</div>';
    });
    html += '</div>';
  }

  // 下游依赖列表
  if(down.length){
    html += '<div class="mb-section"><div class="mb-section-title">下游被依赖</div>';
    down.forEach(function(s){
      html += '<div class="mb-dep-item" onclick="openModal(\''+s+'\')">'+
        '<span style="color:var(--dim);font-size:11px">'+M[s].slug.toUpperCase()+'</span>'+
        '<span class="arrow">→</span>'+
        '<span class="dot" style="background:'+M[s].color+'"></span>'+
        '<span>'+M[s].name+'</span>'+
      '</div>';
    });
    html += '</div>';
  }

  // 数据流接口
  var ns = NETWORK_SCHEMA[m.slug];
  if(ns){
    var ins = ns.inputs||[], outs = ns.outputs||[];
    if(ins.length||outs.length){
      html += '<div class="mb-section"><div class="mb-section-title">数据流接口</div>';
      if(ins.length){
        html += '<div style="font-size:11px;color:var(--dim);margin-bottom:6px">输入接口 · '+ins.length+'</div>';
        ins.forEach(function(it){ html += renderIface(it,'in'); });
      }
      if(outs.length){
        html += '<div style="font-size:11px;color:var(--dim);margin-bottom:6px;'+(ins.length?'margin-top:10px':'')+'">输出接口 · '+outs.length+'</div>';
        outs.forEach(function(it){ html += renderIface(it,'out'); });
      }
      html += '</div>';
    }
  }

  // 打开完整知识图谱（优先新标签页，被拦截则当前页跳转）
  html += '<div class="mb-section">'+
    '<button class="mb-open-btn" onclick="openFullGraph(\''+m.slug+'\')">查看完整知识图谱 →</button>'+
  '</div>';

  body.innerHTML = html;
  document.getElementById('modal').classList.add('open');

  // 绘制依赖关系 SVG
  drawDepGraph(m, up, down);
};

// 绘制模块依赖关系 SVG
function drawDepGraph(m, up, down){
  const svg = document.getElementById('dep-graph');
  if(!svg) return;
  const w = svg.clientWidth || 600;
  const items = up.length + 1 + down.length;
  const h = Math.max(180, items * 50 + 40);
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('height', h);
  const cx = w/2;
  let parts = '';

  // 上游节点（左侧）
  const upY = up.length ? 40 : 0;
  up.forEach(function(s,i){
    const y = 40 + i*46;
    parts += '<line x1="20" y1="'+y+'" x2="'+(cx-50)+'" y2="'+(h/2)+'" stroke="'+M[s].color+'" stroke-width="1.5" opacity="0.5"/>';
    parts += '<circle cx="20" cy="'+y+'" r="7" fill="'+M[s].color+'" opacity="0.85"/>';
    parts += '<text x="34" y="'+(y+4)+'" fill="#6c757d" font-size="11" font-family="sans-serif">'+M[s].name.substring(0,10)+'</text>';
  });

  // 当前节点（中心）
  const curY = h/2;
  parts += '<circle cx="'+cx+'" cy="'+curY+'" r="16" fill="'+m.color+'" opacity="0.3"/>';
  parts += '<circle cx="'+cx+'" cy="'+curY+'" r="11" fill="'+m.color+'"/>';
  parts += '<text x="'+cx+'" y="'+(curY-26)+'" text-anchor="middle" fill="#1a1d29" font-size="13" font-weight="700" font-family="sans-serif">'+m.name.substring(0,14)+'</text>';
  parts += '<text x="'+cx+'" y="'+(curY+34)+'" text-anchor="middle" fill="#6c757d" font-size="10" font-family="monospace">'+m.slug.toUpperCase()+'</text>';

  // 下游节点（右侧）
  down.forEach(function(s,i){
    const y = 40 + i*46;
    parts += '<line x1="'+(cx+50)+'" y1="'+curY+'" x2="'+(w-20)+'" y2="'+y+'" stroke="'+M[s].color+'" stroke-width="1.5" opacity="0.5"/>';
    parts += '<circle cx="'+(w-20)+'" cy="'+y+'" r="7" fill="'+M[s].color+'" opacity="0.85"/>';
    parts += '<text x="'+(w-34)+'" y="'+(y+4)+'" text-anchor="end" fill="#6c757d" font-size="11" font-family="sans-serif">'+M[s].name.substring(0,10)+'</text>';
  });

  // 无依赖提示
  if(!up.length && !down.length){
    parts += '<text x="'+cx+'" y="'+(curY+60)+'" text-anchor="middle" fill="#6c757d" font-size="12" font-family="sans-serif">该模块为独立终端节点</text>';
  }

  svg.innerHTML = parts;
}

function loop(t){
  if(sw.dynamic){
    drawBg(t);
    physics();
    render(t);
  }
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
