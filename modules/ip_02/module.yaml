# 模块元数据（预制菜规范 §3.2）
module:
  id: IP-02
  name: AI监管反馈智能回复系统
  name_en: ip_02
  version: 1.0.0
  category: ipo_audit
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 3
  priority: medium
  roi: ""
  duration: "4个月"
  budget: ""
  description: >
    本方案构建基于LLM、RAG和历史案例库的AI监管反馈智能回复系统。平台通过构建历史IPO反馈问询案例库，利用RAG技术快速检索相似案例，结合LLM自动生成回复初稿，辅助审计人员高效、准确地完成问询回复。平台可将反馈回复效率提升70%，回复质量提升40%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ip_02
  port: 8802
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
