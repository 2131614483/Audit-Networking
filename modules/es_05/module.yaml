# 模块元数据（预制菜规范 §3.2）
module:
  id: ES-05
  name: ESG审计知识库与AI助手
  name_en: es_05
  version: 1.0.0
  category: esg_audit
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 3
  priority: medium
  roi: ""
  duration: "4个月"
  budget: ""
  description: >
    本方案构建基于LLM、RAG和知识图谱的ESG审计知识库与AI助手。平台整合ISSB、CSRD、GRI等主流ESG标准知识，支持自然语言问答、标准比对、方法论推荐等智能功能，帮助审计人员快速获取所需知识。平台可实现ESG审计标准知识覆盖95%以上，知识检索效率提升80%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.es_05
  port: 8705
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
