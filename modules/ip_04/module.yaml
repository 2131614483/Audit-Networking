# 模块元数据（预制菜规范 §3.2）
module:
  id: IP-04
  name: AI财务规范性智能诊断系统
  name_en: ip_04
  version: 1.0.0
  category: ipo_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 3
  priority: medium
  roi: ""
  duration: "5个月"
  budget: ""
  description: >
    本方案构建基于机器学习、NLP和行业对标的AI财务规范性智能诊断系统。平台通过学习历史IPO审核中的财务问题模式，结合行业对标数据，自动识别和诊断企业财务规范性问题，并按风险程度排序。平台可将财务问题发现率提升50-80%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ip_04
  port: 8804
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
