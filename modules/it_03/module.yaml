# 模块元数据（预制菜规范 §3.2）
module:
  id: IT-03
  name: AI代码审计助手
  name_en: it_03
  version: 1.0.0
  category: it_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 3
  priority: medium
  roi: ""
  duration: "5个月"
  budget: "约350万元（含人力、工具及基础设施）"
  description: >
    本方案构建一套基于大语言模型（LLM）+静态应用安全测试（SAST）+知识图谱的AI代码审计助手。利用LLM的深度代码理解能力实现安全漏洞检测和业务逻辑缺陷识别，通过SAST工具进行基础语法级扫描，结合知识图谱沉淀安全审计知识库，实现代码审计的智能化升级。方案实施后，代码审计效率提升80%，严重漏洞发现率提升50-80%，大幅缩短审计周期并提高审计质量。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.it_03
  port: 8303
  health_check: /api/v1/health

dependencies:
  platforms:
    - akg
    - lsb
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
