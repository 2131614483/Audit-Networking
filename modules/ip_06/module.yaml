# 模块元数据（预制菜规范 §3.2）
module:
  id: IP-06
  name: 整改方案AI推荐引擎
  name_en: ip_06
  version: 1.0.0
  category: ipo_audit
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 3
  priority: medium
  roi: ""
  duration: "4个月"
  budget: ""
  description: >
    本方案构建基于LLM、ML和效果预估的整改方案AI推荐引擎。平台通过问题诊断、方案推荐、效果预估和优先级排序的全流程智能化，为审计人员提供高质量的整改方案推荐。平台可将整改方案质量提升50%，方案制定效率提升80%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ip_06
  port: 8806
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
