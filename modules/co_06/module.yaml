# 模块元数据（预制菜规范 §3.2）
module:
  id: CO-06
  name: AI可疑交易报告自动生成
  name_en: co_06
  version: 1.0.0
  category: compliance_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 4
  priority: medium
  roi: "0.5-1年"
  duration: ""
  budget: ""
  description: >
    AI可疑交易报告自动生成平台基于LLM+NLP技术，自动整合多源数据生成结构化STR报告。系统从交易监控系统获取告警数据，从知识图谱提取客户关系和交易网络信息，NLP模型生成交易摘要和可疑模式描述，LLM按监管格式自动生成完整STR。预期STR编写效率提升90%。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.co_06
  port: 8206
  health_check: /api/v1/health

dependencies:
  platforms:
    - akg
    - lsb
  modules:
      - CO-01
      - CO-04
      - CO-05

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
