# 模块元数据（预制菜规范 §3.2）
module:
  id: CB-02
  name: 数据脱敏网关+合规路由系统
  name_en: cb_02
  version: 1.0.0
  category: cross_border_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 3
  priority: medium
  roi: ""
  duration: "5个月"
  budget: ""
  description: >
    本方案构建基于NLP、ML和数据分级的智能数据脱敏网关和合规路由系统。平台通过自动识别敏感数据、智能脱敏、分级路由，实现敏感数据100%识别和脱敏，确保跨境数据传输的合规性。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.cb_02
  port: 9002
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
