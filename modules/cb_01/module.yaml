# 模块元数据（预制菜规范 §3.2）
module:
  id: CB-01
  name: 联邦学习跨境审计平台
  name_en: cb_01
  version: 1.0.0
  category: cross_border_audit
  family: federation
  family_display: Federation Learning
  difficulty: 4
  priority: medium
  roi: ""
  duration: "10个月"
  budget: ""
  description: >
    本方案构建基于联邦学习和隐私计算的跨境审计平台。采用FedAvg算法实现"数据不动模型动"的分布式训练模式，结合安全聚合、差分隐私和多方安全计算技术，在满足各国数据合规要求的前提下，实现跨境的联合数据分析。平台分析效果可达到集中式分析的90-95%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.cb_01
  port: 9001
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
