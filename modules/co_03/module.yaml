# 模块元数据（预制菜规范 §3.2）
module:
  id: CO-03
  name: 合规审计程序自动更新
  name_en: co_03
  version: 1.0.0
  category: compliance_audit
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 4
  priority: medium
  roi: "0.5-1年"
  duration: ""
  budget: ""
  description: >
    合规审计程序自动更新平台通过LLM分析法规变更内容，自动识别受影响的审计程序，RAG知识库提供程序模板和最佳实践参考，规则引擎确保程序更新的一致性和完整性，将更新周期从"月"级缩短至"<1天"。系统实现法规变更→影响分析→程序更新的全自动化闭环。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.co_03
  port: 8203
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
  modules:
      - CO-01
      - CO-02
      - CO-09

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
