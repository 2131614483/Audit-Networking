# 模块元数据（预制菜规范 §3.2）
module:
  id: IT-05
  name: 区块链审计日志存证
  name_en: it_05
  version: 1.0.0
  category: it_audit
  family: blockchain
  family_display: Blockchain
  difficulty: 3
  priority: medium
  roi: ""
  duration: "5个月"
  budget: "约280万元（含人力、工具及基础设施）"
  description: >
    本方案构建一套基于区块链技术的审计日志存证平台，将审计日志的摘要哈希值上链存储，利用区块链的不可篡改性和去中心化共识机制保障审计证据的完整性和可信性。平台支持审计日志的实时摘要上链、数字签名验证、完整性校验和证据链追溯，确保审计证据从产生、存储到验证的全生命周期可信。方案实施后，审计证据完整性达到100%保证，审计证据的可信度和法律效力得到根本性提升。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.it_05
  port: 8305
  health_check: /api/v1/health

dependencies:
  platforms:
    - bce
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
