# 模块元数据（预制菜规范 §3.2）
module:
  id: CM-02
  name: 智能预警分级与自动处理系统
  name_en: cm_02
  version: 1.0.0
  category: continuous_audit
  family: rpa
  family_display: RPA
  difficulty: 3
  priority: medium
  roi: ""
  duration: "5个月"
  budget: ""
  description: >
    本方案构建基于ML、工作流引擎和RPA的智能预警分级与自动处理系统。平台通过ML模型自动对预警进行红/黄/绿三级分级，工作流引擎驱动处理流程，RPA自动执行低风险预警的处理动作。平台可实现低风险预警自动处理率60-80%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.cm_02
  port: 9102
  health_check: /api/v1/health

dependencies:
  platforms:
    - rop
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
