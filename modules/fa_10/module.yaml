# 模块元数据（预制菜规范 §3.2）
module:
  id: FA-10
  name: 知识图谱关联方发现引擎
  name_en: fa_10
  version: 1.0.0
  category: financial_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 4
  priority: high
  roi: "1-2年"
  duration: ""
  budget: ""
  description: >
    知识图谱关联方发现引擎通过融合工商/司法/银行/合同等多源数据，构建百万级实体+千万级关系的关联方网络，利用GNN图神经网络进行3-6跳隐藏关联发现，将关联方识别完整率从60-80%提升至95%+。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.fa_10
  port: 8010
  health_check: /api/v1/health

dependencies:
  platforms:
    - akg
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
