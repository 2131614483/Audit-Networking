# 模块元数据（预制菜规范 §3.2）
module:
  id: FA-11
  name: 关联交易定价公允性AI分析
  name_en: fa_11
  version: 1.0.0
  category: financial_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 4
  priority: high
  roi: "1-1.5年"
  duration: ""
  budget: ""
  description: >
    关联交易定价公允性AI分析方案基于ML模型和行业数据库，采用四种互补的分析方法（内部比较法/外部比较法/转移定价调整法/时间序列异常检测），对关联交易定价进行全面、系统的公允性评估。方案自动从行业数据库获取可比交易数据，利用NLP技术解析交易合同中的定价条款，结合ML模型识别异常定价模式。分析效率提升85%，异常发现率较手工提升200-400%，有效支撑审计师对关联交易定价公允性的专业判断。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.fa_11
  port: 8011
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      - FA-03
      - FA-07
      - FA-10
      - FA-12

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
