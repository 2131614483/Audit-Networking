# 模块元数据（预制菜规范 §3.2）
module:
  id: CB-05
  name: AI多语言审计协作平台
  name_en: cb_05
  version: 1.0.0
  category: cross_border_audit
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 3
  priority: medium
  roi: ""
  duration: "4个月"
  budget: ""
  description: >
    本方案构建基于LLM、NLP和机器翻译的多语言审计协作平台。平台支持100+语言的实时翻译、跨语言搜索和多语言底稿管理，实现审计团队的无语言障碍协作。平台可将多语言处理效率提升95%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.cb_05
  port: 9005
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
