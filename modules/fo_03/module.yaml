# 模块元数据（预制菜规范 §3.2）
module:
  id: FO-03
  name: NLP文本舞弊信号检测
  name_en: fo_03
  version: 1.0.0
  category: legal_audit
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 3
  priority: medium
  roi: ""
  duration: "4个月"
  budget: "约250万元（含人力、工具及基础设施）"
  description: >
    本方案构建一套基于NLP+LLM+情感分析的文本舞弊信号检测平台，对企业内部海量非结构化文本数据进行系统性分析。平台利用NLP技术进行异常关键词发现和主题建模，利用LLM进行深度语义理解和隐含意图识别，结合情感分析检测文本中的情感不一致信号，全面捕捉文本中蕴含的舞弊线索。方案实施后，文本舞弊信号发现率提升200%，大幅提升法务审计对非结构化数据的利用能力。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.fo_03
  port: 8403
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
