# 模块元数据（预制菜规范 §3.2）
module:
  id: CO-04
  name: AML智能交易监控引擎
  name_en: co_04
  version: 1.0.0
  category: compliance_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 5
  priority: high
  roi: "1.5-2年"
  duration: ""
  budget: ""
  description: >
    AML智能交易监控引擎采用三层架构：第一层规则引擎快速过滤已知洗钱模式；第二层ML异常检测发现偏离正常行为的交易；第三层GNN（图神经网络）分析交易网络中的隐蔽洗钱网络。XAI（可解释AI）技术确保每笔告警都有清晰的解释。预期将误报率从90-95%降至40-60%，真实威胁发现率提升20-35%。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.co_04
  port: 8204
  health_check: /api/v1/health

dependencies:
  platforms:
    - akg
  modules:
      - CO-05
      - CO-06
      - IA-02

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
