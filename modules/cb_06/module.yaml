# 模块元数据（预制菜规范 §3.2）
module:
  id: CB-06
  name: 集团审计智能协作平台
  name_en: cb_06
  version: 1.0.0
  category: cross_border_audit
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 3
  priority: medium
  roi: ""
  duration: "5个月"
  budget: ""
  description: >
    本方案构建基于RPA、LLM和知识图谱的集团审计智能协作平台。平台通过RPA自动化审计指令分发和结果收集，LLM辅助跨语言沟通和报告生成，知识图谱实现审计知识的跨区域共享。平台可将集团审计协作效率提升75%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.cb_06
  port: 9006
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
    - rop
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
