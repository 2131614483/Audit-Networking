# 模块元数据（预制菜规范 §3.2）
module:
  id: IA-08
  name: 整改效果自动验证
  name_en: ia_08
  version: 1.0.0
  category: internal_audit
  family: rpa
  family_display: RPA
  difficulty: 3
  priority: low
  roi: "0.3-0.5年"
  duration: ""
  budget: ""
  description: >
    整改效果自动验证平台通过RPA自动执行验证流程、规则引擎进行客观判定、ML模型进行效果评估和趋势预测，将验证周期从"数月"缩短至"实时"。系统自动登录业务系统抓取数据，执行预定义的验证规则（控制测试/数据比对/权限检查），生成验证报告。对已验证通过的整改，系统持续监控，确保控制效果不退化。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ia_08
  port: 8108
  health_check: /api/v1/health

dependencies:
  platforms:
    - rop
  modules:
      - IA-02
      - IA-06
      - IA-07

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
