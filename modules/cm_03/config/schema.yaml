# 配置项 JSON Schema（用于校验 default/custom.yaml）
$schema: "http://json-schema.org/draft-07/schema#"
title: CM-03 配置
type: object
properties:
  module:
    type: object
    properties:
      id: {type: string}
      name: {type: string}
  threshold:
    type: object
    properties:
      confidence: {type: number, minimum: 0, maximum: 1}
