# 模块元数据（预制菜规范 §3.2）
module:
  id: CM-03
  name: 持续审计方法论框架
  name_en: cm_03
  version: 1.0.0
  category: continuous_audit
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 3
  priority: medium
  roi: ""
  duration: "4个月"
  budget: ""
  description: >
    本方案构建基于LLM、知识图谱和最佳实践的持续审计方法论框架。平台通过整合持续审计的理论知识和最佳实践，构建方法论知识图谱，支持方法论推荐、程序生成和质量检查。平台可实现持续审计方法论的标准化。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.cm_03
  port: 9103
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
