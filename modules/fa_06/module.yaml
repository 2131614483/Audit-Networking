# 模块元数据（预制菜规范 §3.2）
module:
  id: FA-06
  name: AI函证差异智能分析
  name_en: fa_06
  version: 1.0.0
  category: financial_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 3
  priority: high
  roi: "0.5-1年"
  duration: ""
  budget: ""
  description: >
    AI函证差异智能分析方案基于LLM大语言模型和NLP技术，自动识别函证差异类型（金额/账号/利率/冻结），结合知识图谱和规则引擎分析差异根因，自动生成未达账项调节表和差异处理建议。系统能够处理80%+的常见差异类型，差异分析效率提升90%，准确率>85%。对于复杂差异，AI提供根因分析和处理建议供审计师参考确认，大幅降低人工分析工作量。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.fa_06
  port: 8006
  health_check: /api/v1/health

dependencies:
  platforms:
    - akg
    - lsb
  modules:
      - FA-03
      - FA-04
      - FA-05
      - FA-07

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
