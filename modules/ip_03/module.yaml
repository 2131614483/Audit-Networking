# 模块元数据（预制菜规范 §3.2）
module:
  id: IP-03
  name: 知识图谱历史沿革梳理系统
  name_en: ip_03
  version: 1.0.0
  category: ipo_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 3
  priority: medium
  roi: ""
  duration: "4个月"
  budget: ""
  description: >
    本方案构建基于知识图谱、NLP和时间轴分析的历史沿革梳理系统。通过自动抽取企业工商档案、股东会决议等文件中的关键信息，构建企业历史沿革知识图谱，自动生成股权变更时间线，并进行合规性检查。平台可将历史沿革梳理效率提升90%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ip_03
  port: 8803
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
