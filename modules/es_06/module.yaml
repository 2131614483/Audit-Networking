# 模块元数据（预制菜规范 §3.2）
module:
  id: ES-06
  name: AI-ESG审计方法论引擎
  name_en: es_06
  version: 1.0.0
  category: esg_audit
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 3
  priority: medium
  roi: ""
  duration: "5个月"
  budget: ""
  description: >
    本方案构建基于LLM、知识图谱和模板引擎的AI-ESG审计方法论引擎。平台通过分析审计对象特征，自动生成定制化的审计程序、证据收集清单和底稿模板，实现ESG审计方法论的标准化和自动化。平台可将方法论标准化程度提升60%，审计程序编制效率提升80%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.es_06
  port: 8706
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
