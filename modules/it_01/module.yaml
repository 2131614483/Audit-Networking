# 模块元数据（预制菜规范 §3.2）
module:
  id: IT-01
  name: IT审计自动化平台
  name_en: it_01
  version: 1.0.0
  category: it_audit
  family: rpa
  family_display: RPA
  difficulty: 3
  priority: medium
  roi: ""
  duration: "6个月"
  budget: "约420万元（含人力、工具及基础设施）"
  description: >
    本方案构建一套以RPA（机器人流程自动化）为操作执行层、API（应用程序接口）为数据采集层、ML（机器学习）为智能分析层的三位一体IT审计自动化平台。通过自动资产发现引擎全面识别企业IT资产清单，利用100+技术栈连接器实现跨平台配置数据自动采集，结合ML驱动的配置合规检查模型实现自动化审计判定，最终将审计覆盖率从20-30%提升至95%以上，单系统审计时间从2-5天压缩至1-2小时。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.it_01
  port: 8301
  health_check: /api/v1/health

dependencies:
  platforms:
    - rop
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
