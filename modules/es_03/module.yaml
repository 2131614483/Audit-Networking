# 模块元数据（预制菜规范 §3.2）
module:
  id: ES-03
  name: 卫星遥感AI环境监测平台
  name_en: es_03
  version: 1.0.0
  category: esg_audit
  family: cv
  family_display: Computer Vision
  difficulty: 4
  priority: medium
  roi: ""
  duration: "8个月"
  budget: ""
  description: >
    本方案构建基于卫星遥感和计算机视觉的AI环境监测平台。通过接入Sentinel-2、PlanetScope等多源卫星数据，利用CV模型进行土地利用变化检测、水体监测、植被健康评估、大气污染物监测等，为ESG审计提供独立、客观、可追溯的环境数据验证能力。平台可发现企业环境声明与实际情况的偏差，将绿色漂洗发现率提升50-70%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.es_03
  port: 8703
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
