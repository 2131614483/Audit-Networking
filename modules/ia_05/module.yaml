# 模块元数据（预制菜规范 §3.2）
module:
  id: IA-05
  name: AI驱动的管理建议书
  name_en: ia_05
  version: 1.0.0
  category: internal_audit
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 4
  priority: high
  roi: "0.5-1年"
  duration: ""
  budget: ""
  description: >
    AI驱动的管理建议书平台基于LLM+RAG技术，构建行业管理建议知识库，自动生成针对性、可操作、可量化的管理建议。系统通过RAG检索历史优秀案例和行业最佳实践，LLM生成建议初稿，ML模型自动量化建议价值，审计经理审核调整后形成最终建议书。预期建议采纳率提升30-50%。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ia_05
  port: 8105
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
  modules:
      - IA-01
      - IA-04
      - IA-06
      - IA-07

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
