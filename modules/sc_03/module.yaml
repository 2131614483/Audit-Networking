# 模块元数据（预制菜规范 §3.2）
module:
  id: SC-03
  name: 供应商持续风险监控平台
  name_en: sc_03
  version: 1.0.0
  category: supply_chain_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 3
  priority: medium
  roi: ""
  duration: "4个月"
  budget: ""
  description: >
    本方案构建基于实时数据流、机器学习和自然语言处理的供应商持续风险监控平台。通过7×24小时自动采集舆情、司法、财务、合规等多维数据，利用ML模型实时分析风险信号，NLP引擎自动理解风险事件内容，实现供应商风险的实时感知、智能预警和自动处置。将风险感知从传统的年度/季度频率提升到实时级别，显著缩短风险发现到处置的时间窗口。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.sc_03
  port: 8603
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
