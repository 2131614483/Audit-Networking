# 模块元数据（预制菜规范 §3.2）
module:
  id: FI-05
  name: AI监管口径自动更新系统
  name_en: fi_05
  version: 1.0.0
  category: other
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 3
  priority: medium
  roi: ""
  duration: "4个月"
  budget: ""
  description: >
    本方案构建基于NLP、LLM和RAG的监管口径自动更新系统。平台通过自动采集监管文件，利用NLP和LLM识别口径变化，自动生成更新建议和影响分析，实现监管口径从"周级"更新提升到"<1天"。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.fi_05
  port: 8905
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
