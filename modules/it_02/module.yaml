# 模块元数据（预制菜规范 §3.2）
module:
  id: IT-02
  name: AI配置合规扫描引擎
  name_en: it_02
  version: 1.0.0
  category: it_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 3
  priority: medium
  roi: ""
  duration: "4个月"
  budget: "约250万元（含人力、工具及基础设施）"
  description: >
    本方案构建一套基于机器学习+规则引擎+CIS Benchmark的AI配置合规扫描引擎，实现IT系统配置合规的自动化、智能化检查。引擎内置CIS Benchmark、等保2.0、SOX等主流合规标准规则库，通过ML模型自动识别配置异常和漂移，结合规则引擎进行精确合规判定，提供统一的可视化合规仪表盘。方案实施后，配置检查效率可提升90%以上，显著降低人工工作量。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.it_02
  port: 8302
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
