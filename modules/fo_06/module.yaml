# 模块元数据（预制菜规范 §3.2）
module:
  id: FO-06
  name: 证据链智能构建
  name_en: fo_06
  version: 1.0.0
  category: legal_audit
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 3
  priority: medium
  roi: ""
  duration: "4个月"
  budget: "约260万元（含人力、工具及基础设施）"
  description: >
    本方案构建一套基于知识图谱（KG）+时间序列+LLM的证据链智能构建平台，实现从分散证据到完整证据链的自动化构建。平台利用知识图谱技术构建证据之间的关联网络，利用时间序列分析自动生成事件时间线，利用LLM进行证据推理和完整性检查。方案实施后，证据关联发现率提升300%，证据链构建时间大幅缩短，证据完整性得到系统性保障。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.fo_06
  port: 8406
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
