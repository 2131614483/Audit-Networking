# 模块元数据（预制菜规范 §3.2）
module:
  id: IT-04
  name: IT持续审计平台
  name_en: it_04
  version: 1.0.0
  category: it_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 4
  priority: medium
  roi: ""
  duration: "7个月"
  budget: "约500万元（含人力、工具及基础设施）"
  description: >
    本方案构建一套基于实时数据流+机器学习+规则引擎的IT持续审计平台，实现从"年度快照式"审计到"实时持续式"审计的范式转变。平台通过Kafka实时数据流采集IT系统的配置变更、用户行为、网络流量、安全事件等关键指标，利用ML异常检测模型实时识别异常行为，结合规则引擎进行合规判定，提供统一的可视化持续审计仪表盘。方案实施后，审计模式从年度快照转变为持续监控，异常发现时间从天/周级缩短至分钟/小时级。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.it_04
  port: 8304
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
