# 模块元数据（预制菜规范 §3.2）
module:
  id: CM-05
  name: 持续审计仪表板
  name_en: cm_05
  version: 1.0.0
  category: continuous_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 2
  priority: medium
  roi: ""
  duration: "3个月"
  budget: ""
  description: >
    本方案构建基于BI、实时数据和故事化呈现的持续审计仪表板。平台通过实时数据可视化、趋势分析和自动报告功能，为管理层和审计人员提供直观、全面、及时的审计洞察。平台可将管理层认可度提升50%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.cm_05
  port: 9105
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
