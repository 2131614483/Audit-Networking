# 模块元数据（预制菜规范 §3.2）
module:
  id: FI-02
  name: 知识图谱担保链风险分析系统
  name_en: fi_02
  version: 1.0.0
  category: other
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 3
  priority: medium
  roi: ""
  duration: "6个月"
  budget: ""
  description: >
    本方案构建基于知识图谱、图神经网络和压力测试的担保链风险分析系统。通过构建企业担保网络知识图谱，利用GNN模型进行风险传导分析和互保圈识别，结合压力测试模拟极端情况下的风险传导。平台可将担保风险发现率提升300%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.fi_02
  port: 8902
  health_check: /api/v1/health

dependencies:
  platforms:
    - akg
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
