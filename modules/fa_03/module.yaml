# 模块元数据（预制菜规范 §3.2）
module:
  id: FA-03
  name: 审计数据湖建设
  name_en: fa_03
  version: 1.0.0
  category: financial_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 4
  priority: high
  roi: "1-1.5年"
  duration: ""
  budget: ""
  description: >
    审计数据湖采用三区架构（原始区/标准化区/分析就绪区），基于MinIO对象存储和Apache Spark ETL引擎构建，结合Apache Atlas实现全链路元数据管理和数据血缘追踪。Delta Lake提供ACID事务和数据版本控制能力，确保数据的可追溯性和一致性。通过数据湖的建设，历史数据跨项目复用率从<20%提升至>80%，数据查询效率提升90%+，为所有AI分析方案提供统一、高效、可信的数据基础。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.fa_03
  port: 8003
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      - FA-01
      - FA-02
      - FA-07
      - FA-08
      - FA-09
      - FA-10
      - FA-11
      - FA-12

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
