# 模块元数据（预制菜规范 §3.2）
module:
  id: FA-07
  name: 智能底稿自动生成平台
  name_en: fa_07
  version: 1.0.0
  category: financial_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 3
  priority: high
  roi: "0.5-1年"
  duration: ""
  budget: ""
  description: >
    智能底稿自动生成平台通过200+标准化模板库、LLM智能分析和结论生成、RPA自动数据填入和交叉引用，将底稿编制时间从占总工时25-35%压缩至5-8%，底稿错误率降低95%+。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.fa_07
  port: 8007
  health_check: /api/v1/health

dependencies:
  platforms:
    - akg
    - lsb
    - rop
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
