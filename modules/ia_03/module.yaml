# 模块元数据（预制菜规范 §3.2）
module:
  id: IA-03
  name: 审计资源智能分配引擎
  name_en: ia_03
  version: 1.0.0
  category: internal_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 3
  priority: medium
  roi: "0.5-1年"
  duration: ""
  budget: ""
  description: >
    审计资源智能分配引擎基于约束优化理论，结合ML人员技能预测和遗传算法求解最优分配方案。系统综合考虑项目需求（技能/行业/复杂度/地域）、人员能力（技能评分/经验/绩效）、发展需求（培训目标/轮岗计划）和约束条件（工时上限/成本预算），实现资源匹配度提升40-50%。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ia_03
  port: 8103
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      - IA-01
      - IA-02
      - IA-04
      - IA-06

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
