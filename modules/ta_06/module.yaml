# 模块元数据（预制菜规范 §3.2）
module:
  id: TA-06
  name: 知识图谱全球关联交易分析
  name_en: ta_06
  version: 1.0.0
  category: tax_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 3
  priority: medium
  roi: ""
  duration: "6个月"
  budget: "约360万元（含人力、工具及基础设施）"
  description: >
    本方案构建一套基于知识图谱（KG）+图神经网络（GNN）+利润分割分析的全球关联交易分析平台，实现跨国企业全球关联交易的系统性分析和转让定价风险的智能识别。平台构建全球实体网络知识图谱，利用GNN进行异常交易模式和利润转移路径的自动发现，结合利润分割模型进行功能-风险-利润的匹配分析。方案实施后，利润转移风险发现率提升200-400%，全球关联交易分析效率实现质的突破。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ta_06
  port: 8506
  health_check: /api/v1/health

dependencies:
  platforms:
    - akg
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
