# 模块元数据（预制菜规范 §3.2）
module:
  id: CO-05
  name: 知识图谱洗钱网络发现
  name_en: co_05
  version: 1.0.0
  category: compliance_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 5
  priority: high
  roi: "1.5-2年"
  duration: ""
  budget: ""
  description: >
    知识图谱洗钱网络发现平台构建包含客户、账户、交易、设备、外部实体等多维实体的知识图谱，通过GNN模型和子图模式匹配算法自动发现隐蔽洗钱网络。系统支持资金流可视化追踪、新型洗钱模式自动发现、洗钱网络全景展示，预期新型洗钱模式发现率提升300%。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.co_05
  port: 8205
  health_check: /api/v1/health

dependencies:
  platforms:
    - akg
  modules:
      - CO-04
      - CO-06
      - IA-02

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
