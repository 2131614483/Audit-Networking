# 模块元数据（预制菜规范 §3.2）
module:
  id: TA-05
  name: ML可比公司智能筛选
  name_en: ta_05
  version: 1.0.0
  category: tax_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 2
  priority: medium
  roi: ""
  duration: "3个月"
  budget: "约180万元（含人力、工具及基础设施）"
  description: >
    本方案构建一套基于机器学习的可比公司智能筛选引擎，实现可比公司筛选的标准化、自动化和智能化。引擎利用ML模型进行多维度相似度计算，自动完成行业分类匹配、财务指标匹配和功能风险评估，提供量化的可比性评分和推荐排名。方案实施后，可比公司筛选准确率提升30-50%，筛选时间从2-3周缩短到1-2天。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ta_05
  port: 8505
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
