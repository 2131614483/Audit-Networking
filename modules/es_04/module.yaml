# 模块元数据（预制菜规范 §3.2）
module:
  id: ES-04
  name: 知识图谱绿色漂洗检测平台
  name_en: es_04
  version: 1.0.0
  category: esg_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 3
  priority: medium
  roi: ""
  duration: "5个月"
  budget: ""
  description: >
    本方案构建基于知识图谱、NLP和多源交叉验证的绿色漂洗检测平台。通过构建企业ESG声明知识图谱，将企业各渠道的环境声明进行结构化表示，并与卫星数据、传感器数据、第三方数据等客观证据进行交叉验证，自动识别声明与事实的偏差。平台可将绿色漂洗发现率提升300%，为ESG审计提供系统性的绿色漂洗检测能力。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.es_04
  port: 8704
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
