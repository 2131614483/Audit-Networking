# 模块元数据（预制菜规范 §3.2）
module:
  id: FA-12
  name: 关联交易披露完整性检查
  name_en: fa_12
  version: 1.0.0
  category: financial_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 3
  priority: high
  roi: "0.5-1年"
  duration: ""
  budget: ""
  description: >
    关联交易披露完整性检查方案基于NLP语义比对技术和规则引擎，将监管要求清单化、结构化（100+检查项），自动扫描财务报表附注中的关联交易披露内容，逐项检查披露完整性。LLM模型自动识别披露缺陷并生成补充建议。方案与FA-10关联方发现引擎和FA-11定价分析深度集成，确保发现的关联交易全部被完整披露。披露遗漏率降低90%+，检查覆盖率达100%。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.fa_12
  port: 8012
  health_check: /api/v1/health

dependencies:
  platforms:
    - akg
    - lsb
  modules:
      - FA-03
      - FA-09
      - FA-10
      - FA-11

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
