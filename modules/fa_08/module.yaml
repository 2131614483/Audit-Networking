# 模块元数据（预制菜规范 §3.2）
module:
  id: FA-08
  name: 底稿自动勾稽检查
  name_en: fa_08
  version: 1.0.0
  category: financial_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 2
  priority: high
  roi: "0.3-0.5年"
  duration: ""
  budget: ""
  description: >
    底稿自动勾稽检查方案基于200+预定义勾稽规则库（涵盖横向勾稽/纵向勾稽/计算勾稽/逻辑勾稽四大类），通过规则引擎自动执行全量勾稽验证，结合ML异常检测识别可疑勾稽差异。系统自动标记差异项、计算差异幅度、生成调整建议，检查覆盖率达100%，勾稽错误减少95%+。方案与FA-07智能底稿自动生成平台深度集成，在底稿生成的同时自动执行勾稽检查，实现"生成即检查"。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.fa_08
  port: 8008
  health_check: /api/v1/health

dependencies:
  platforms:
    - akg
  modules:
      - FA-02
      - FA-03
      - FA-07
      - FA-09

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
