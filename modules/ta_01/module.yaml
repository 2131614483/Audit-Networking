# 模块元数据（预制菜规范 §3.2）
module:
  id: TA-01
  name: AI发票智能审计平台
  name_en: ta_01
  version: 1.0.0
  category: tax_audit
  family: cv
  family_display: Computer Vision
  difficulty: 4
  priority: medium
  roi: ""
  duration: "7个月"
  budget: "约500万元（含人力、工具及基础设施）"
  description: >
    本方案构建一套基于CV（计算机视觉）+ML+RPA+KG的AI发票智能审计平台，实现发票的全流程智能化处理。平台利用PaddleOCR微调模型和LayoutLMv3进行发票信息的高精度识别，通过ML模型进行发票分类和异常检测，利用RPA实现跨系统的四单自动匹配，通过知识图谱沉淀发票审计知识。方案实施后，发票审计效率提升90%以上，识别准确率超过99%。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ta_01
  port: 8501
  health_check: /api/v1/health

dependencies:
  platforms:
    - rop
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
