# 模块元数据（预制菜规范 §3.2）
module:
  id: IA-02
  name: 持续风险监控平台
  name_en: ia_02
  version: 1.0.0
  category: internal_audit
  family: kg_gnn
  family_display: Knowledge Graph / GNN
  difficulty: 5
  priority: high
  roi: "1-1.5年"
  duration: ""
  budget: ""
  description: >
    持续风险监控平台构建"规则引擎+ML异常检测+知识图谱关联分析"三层监控体系，对200+监控规则进行实时执行和智能优化。通过实时数据流处理企业运营数据，ML模型自动调整阈值和识别异常模式，知识图谱发现跨业务线的风险传导路径。异常事件自动分级预警，高风险事件触发即时通知和自动化处置流程，实现从"定期审计"到"持续监控"的范式转变。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ia_02
  port: 8102
  health_check: /api/v1/health

dependencies:
  platforms:
    - akg
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
