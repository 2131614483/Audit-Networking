# 模块元数据（预制菜规范 §3.2）
module:
  id: CO-09
  name: 隐私合规自动审计引擎
  name_en: co_09
  version: 1.0.0
  category: compliance_audit
  family: llm_rag
  family_display: LLM / RAG
  difficulty: 4
  priority: high
  roi: "0.5-1年"
  duration: ""
  budget: ""
  description: >
    隐私合规自动审计引擎通过NLP自动分析隐私政策合规性，RPA自动化DSAR处理流程，LLM进行供应商合规文档审查，规则引擎执行标准化的隐私合规检查。系统覆盖隐私审计的主要模块，预期隐私审计效率提升80%。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.co_09
  port: 8209
  health_check: /api/v1/health

dependencies:
  platforms:
    - lsb
    - rop
  modules:
      - CO-01
      - CO-03
      - CO-07
      - CO-08

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
