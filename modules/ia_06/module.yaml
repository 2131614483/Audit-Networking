# 模块元数据（预制菜规范 §3.2）
module:
  id: IA-06
  name: 内审价值量化模型
  name_en: ia_06
  version: 1.0.0
  category: internal_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 3
  priority: medium
  roi: "0.3-0.5年"
  duration: ""
  budget: ""
  description: >
    内审价值量化模型基于ML和ROI计算引擎，建立多维度的审计价值量化框架。模型从直接财务价值、风险降低价值、战略价值、合规价值和预防价值五个维度综合量化审计贡献，通过Monte Carlo模拟进行区间估算，结合归因分析模型合理分配审计贡献度。实现价值量化覆盖率>90%，为审计部门提供可信的价值证明。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ia_06
  port: 8106
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      - IA-01
      - IA-04
      - IA-05
      - IA-07

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
