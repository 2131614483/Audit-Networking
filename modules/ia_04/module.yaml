# 模块元数据（预制菜规范 §3.2）
module:
  id: IA-04
  name: 审计价值仪表板
  name_en: ia_04
  version: 1.0.0
  category: internal_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 3
  priority: medium
  roi: "0.3-0.5年"
  duration: ""
  budget: ""
  description: >
    审计价值仪表板基于BI技术构建实时可视化平台，通过ML模型对审计发现进行价值量化计算，设计分层KPI树（战略层/运营层/执行层）全面展示审计贡献。平台支持从董事会到审计师的多角色视图，实时数据刷新，并提供"假设分析"场景模拟能力，帮助审计部门用数据说话，提升管理层认可度50%以上。  ---  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.ia_04
  port: 8104
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      - IA-01
      - IA-05
      - IA-06
      - IA-07

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
