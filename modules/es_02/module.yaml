# 模块元数据（预制菜规范 §3.2）
module:
  id: ES-02
  name: AI碳排放自动核算引擎
  name_en: es_02
  version: 1.0.0
  category: esg_audit
  family: ml_nlp
  family_display: ML / NLP
  difficulty: 3
  priority: medium
  roi: ""
  duration: "6个月"
  budget: ""
  description: >
    本方案构建基于机器学习、IoT数据接入和排放因子库的AI碳排放自动核算引擎。平台通过自动采集企业能耗数据、生产数据、供应链数据，结合排放因子库，利用ML模型自动计算Scope1/2/3碳排放，实现碳核算的全流程自动化。平台将碳核算效率提升85%，核算精度提升30%以上。  ## 二、技术架构设计

runtime:
  language: python
  language_version: "3.11"
  framework: fastapi
  package: modules.es_02
  port: 8702
  health_check: /api/v1/health

dependencies:
  platforms:
    - adl
  modules:
      []

interfaces:
  consumes: []
  produces: []
  rest_apis:
    - path: /api/v1/execute
      method: POST
      desc: 触发模块执行

resources:
  cpu: "1"
  memory: "1Gi"

configurable:
  threshold:
    confidence: 0.85
  model:
    path: models/model.pkl

extension_points:
  - src/custom/custom_rules.py
  - src/custom/custom_thresholds.py
  - src/custom/custom_formatter.py
