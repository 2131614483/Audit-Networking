<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审计智能化平台 · 智能编排引擎</title>
<style>
:root{
  --bg:#ffffff; --text:#1a1d29; --dim:#6c757d; --border:#d8dde5; --panel:#f8f9fa;
  --ml:#4A90D9; --llm:#E67E22; --kg:#27AE60; --rpa:#9B59B6;
  --cv:#E74C3C; --bc:#F39C12; --fl:#1ABC9C; --st:#5D6D7E;
  --rs:#16A085; --db:#D35400;
  --pending:#adb5bd; --running:#4A90D9; --done:#27AE60; --failed:#E74C3C;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:1400px;margin:0 auto;padding:20px}

/* ===== 顶部 ===== */
.top-section{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:16px}
.top-section h1{font-size:22px;font-weight:700;background:linear-gradient(90deg,#4A90D9,#27AE60);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-section .subtitle{color:var(--dim);font-size:13px;margin-top:4px;margin-bottom:16px}
#requirement{width:100%;min-height:80px;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;outline:none;transition:border-color .2s}
#requirement:focus{border-color:var(--ml)}
.case-buttons{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.case-btn{padding:6px 16px;border:1px solid var(--border);border-radius:20px;background:#fff;color:var(--text);font-size:13px;cursor:pointer;transition:.2s}
.case-btn:hover{border-color:var(--ml);color:var(--ml);background:#e8f2fc}
.action-buttons{display:flex;gap:12px;margin-top:14px}
.primary-btn{padding:10px 28px;border:none;border-radius:8px;background:linear-gradient(135deg,#4A90D9,#27AE60);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;box-shadow:0 2px 8px rgba(74,144,217,.3)}
.primary-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(74,144,217,.4)}
.exec-btn{padding:10px 28px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--dim);font-size:15px;font-weight:600;cursor:not-allowed;transition:.2s}
.exec-btn.active{border-color:var(--ml);color:var(--ml);cursor:pointer;background:#fff}
.exec-btn.active:hover{background:#e8f2fc}
.exec-btn.running{border-color:var(--running);color:var(--running);cursor:wait}

/* ===== 中部 ===== */
.mid-section{display:flex;gap:16px;margin-bottom:16px}
.dag-area{flex:0 0 60%;height:500px;position:relative;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.dag-area svg{width:100%;height:100%;display:block}
.detail-panel{flex:1;height:500px;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
.detail-panel::-webkit-scrollbar{width:6px}
.detail-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.panel-section{margin-bottom:18px}
.panel-section h3{font-size:14px;color:var(--ml);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
#reasoning{font-size:12px;color:var(--text);line-height:1.8;white-space:pre-wrap;font-family:inherit}
.module-item{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:3px 0;background:#fff;border-radius:6px;border:1px solid var(--border);font-size:12px}
.module-item .mi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.module-item .mi-name{flex:1;font-weight:500}
.module-item .mi-family{font-size:10px;color:var(--dim)}
.module-item .mi-role{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--panel);color:var(--dim)}
.contract-ok{color:var(--done);font-weight:600;font-size:13px}
.contract-fail{color:var(--failed);font-weight:600;font-size:13px}
.contract-detail{font-size:11px;color:var(--dim);margin-top:4px}
.exec-order{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.exec-order .eo-node{padding:3px 8px;border-radius:4px;font-size:11px;font-weight:500;color:#fff}
.exec-order .eo-arrow{color:var(--dim);font-size:12px}
.empty-state{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--dim);font-size:14px;text-align:center}
.dag-legend{position:absolute;bottom:10px;left:10px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:11px;display:flex;flex-wrap:wrap;gap:8px;max-width:300px}
.dag-legend .lg-item{display:flex;align-items:center;gap:4px}
.dag-legend .lg-dot{width:8px;height:8px;border-radius:50%}
.dag-status-legend{position:absolute;bottom:10px;right:10px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:11px;display:flex;gap:10px}
.dag-status-legend .sl-item{display:flex;align-items:center;gap:4px}

/* SVG node/edge */
.node rect{transition:all .3s}
.node.pending rect{fill:#f0f1f3;stroke:var(--pending);stroke-width:1.5}
.node.running rect{fill:#e8f2fc;stroke:var(--running);stroke-width:2.5;animation:nodePulse 1s ease-in-out infinite}
.node.done rect{fill:#e8f7ee;stroke:var(--done);stroke-width:2}
.node.failed rect{fill:#fdeaea;stroke:var(--failed);stroke-width:2}
@keyframes nodePulse{0%,100%{stroke-width:2.5}50%{stroke-width:4.5}}
.node text{pointer-events:none}
.node .n-name{font-size:12px;font-weight:600;fill:var(--text);text-anchor:middle}
.node .n-slug{font-size:9px;fill:var(--dim);text-anchor:middle}
.node .n-status{font-size:13px;font-weight:700;text-anchor:middle}
.node.pending .n-status{fill:var(--pending)}
.node.running .n-status{fill:var(--running)}
.node.done .n-status{fill:var(--done)}
.node.failed .n-status{fill:var(--failed)}
.edge{fill:none;stroke:#c4c9d2;stroke-width:1.5;transition:stroke .3s}
.edge.done{stroke:var(--done);stroke-width:2}
.edge-label rect{fill:#fff;stroke:var(--border);stroke-width:0.5}
.edge-label text{font-size:9px;fill:var(--dim);text-anchor:middle}

/* ===== 底部 ===== */
.bottom-section{display:flex;gap:16px}
.log-area{flex:0 0 45%;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.log-area h3,.report-area h3{font-size:14px;color:var(--ml);padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
#exec-log{flex:1;overflow-y:auto;padding:12px;font-family:"Consolas","Courier New",monospace;font-size:12px;min-height:200px;max-height:420px}
#exec-log::-webkit-scrollbar{width:6px}
#exec-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.log-entry{padding:3px 0;line-height:1.7;border-bottom:1px dotted var(--border)}
.log-time{color:var(--dim);margin-right:6px}
.log-step{color:var(--ml);font-weight:600;margin-right:6px}
.log-module{font-weight:600;margin-right:6px}
.log-status-running{color:var(--running)}
.log-status-done{color:var(--done)}
.log-status-failed{color:var(--failed)}
.log-duration{color:var(--llm);margin-right:6px}
.log-summary{color:var(--text)}
.log-placeholder{color:var(--dim);font-style:italic}
.report-area{flex:1;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
#final-report{flex:1;overflow-y:auto;padding:16px;max-height:420px}
#final-report::-webkit-scrollbar{width:6px}
#final-report::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.report-card{background:var(--panel);border-radius:8px;padding:14px;margin-bottom:12px;border-left:4px solid var(--ml)}
.report-card.rc-risk{border-left-color:var(--failed)}
.report-card.rc-finding{border-left-color:var(--llm)}
.report-card.rc-rec{border-left-color:var(--done)}
.report-card .rc-title{font-size:13px;font-weight:700;margin-bottom:8px}
.report-card .rc-body{font-size:12px;color:var(--text);line-height:1.7}
.risk-badge{display:inline-block;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:700;color:#fff}
.risk-高{background:var(--failed)}
.risk-中高{background:var(--llm)}
.risk-中{background:var(--bc)}
.risk-低{background:var(--done)}
.finding-item{padding:4px 0 4px 16px;position:relative}
.finding-item::before{content:"▸";position:absolute;left:0;color:var(--llm)}
.rec-item{padding:4px 0 4px 16px;position:relative}
.rec-item::before{content:"✓";position:absolute;left:0;color:var(--done)}
.mo-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:10px;margin:6px 0}
.mo-card .mo-header{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.mo-card .mo-dot{width:8px;height:8px;border-radius:50%}
.mo-card .mo-name{font-size:12px;font-weight:600;flex:1}
.mo-card .mo-time{font-size:10px;color:var(--dim)}
.mo-card .mo-summary{font-size:11px;color:var(--dim);margin-bottom:4px}
.mo-card .mo-field{font-size:11px;padding:1px 0}
.mo-card .mo-key{color:var(--ml);font-weight:500}

/* ===== 后端集成相关样式 ===== */
#reasoning-text{white-space:pre-wrap;font-size:12px;line-height:1.7;color:#495057}
.status-msg{font-size:12px;padding:6px 12px;border-radius:6px;margin-top:10px;display:none}
.status-msg.success{background:#e8f7ee;color:#27AE60;display:block}
.status-msg.warn{background:#fff4e6;color:#E67E22;display:block}
.status-msg.error{background:#fdeaea;color:#E74C3C;display:block}
#backend-status{font-size:11px;color:#6c757d}
</style>
</head>

<div class="container">

<!-- ===== 顶部：标题 + 需求输入 ===== -->
<section class="top-section">
  <h1>审计智能化平台 · 智能编排引擎</h1>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">

  </div>
  <textarea id="requirement" placeholder="请输入审计需求，例如：审计公司与关联方之间的交易，检查关联方披露完整性、交易定价公允性..."></textarea>
  <div class="case-buttons">
    <button class="case-btn" data-case="related_party">关联交易审计</button>
    <button class="case-btn" data-case="aml">反洗钱审计</button>

    <button id="exec-btn" class="exec-btn" disabled>执行</button>

</section>

<!-- ===== 中部：组网方案可视化 ===== -->
<section class="mid-section">
  <div class="dag-area">
    <svg id="dag-canvas" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 Z" fill="#c4c9d2"/>
        </marker>
        <marker id="arrowhead-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 Z" fill="#27AE60"/>
        </marker>
      </defs>
      <g id="dag-content"></g>
    </svg>
    <div id="dag-empty" class="empty-state">
      <p>📝 点击「AI 规划方案」生成审计组网方案</p>
    </div>
    <div class="dag-legend" id="dag-legend" style="display:none"></div>
    <div class="dag-status-legend" id="dag-status-legend" style="display:none">
      <div class="sl-item"><span style="color:var(--pending)">●</span>待执行</div>
      <div class="sl-item"><span style="color:var(--running)">●</span>执行中</div>
      <div class="sl-item"><span style="color:var(--done)">●</span>已完成</div>
    </div>
  </div>
  <div class="detail-panel">
    <div class="panel-section">
      <h3>AI 推理过程</h3>
      <div id="reasoning"><span style="color:var(--dim)">规划后展示推理过程...</span></div>
    </div>
    <div class="panel-section">
      <h3>选中模块</h3>
      <div id="modules-list"><span style="color:var(--dim)">暂无</span></div>
    </div>
    <div class="panel-section">
      <h3>接口契约校验</h3>
      <div id="contract-check"><span style="color:var(--dim)">暂无</span></div>
    </div>
    <div class="panel-section">
      <h3>执行顺序</h3>
      <div id="exec-order"><span style="color:var(--dim)">暂无</span></div>
    </div>
  </div>
</section>

<!-- ===== 底部：执行结果 ===== -->
<section class="bottom-section">
  <div class="log-area">
    <h3>执行日志</h3>
    <div id="exec-log">
      <div class="log-placeholder">执行后在此显示实时日志...</div>
    </div>
  </div>
  <div class="report-area" id="report-area" style="display:none">
    <h3>最终审计报告</h3>
    <div id="final-report"></div>
  </div>
</section>

</div>

/* ======================= 工具函数 ======================= */
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function getEdgeDataType(s,t){
  return EDGE_TYPES[s] && EDGE_TYPES[s][t] ? EDGE_TYPES[s][t] : null;
}

// 拓扑排序（处理环：选择入度最低的节点打破环）
function topologicalSort(modules, edges){
  const inDeg={}, adj={};
  modules.forEach(m=>{inDeg[m]=0;adj[m]=[];});
  edges.forEach(([s,t])=>{adj[s].push(t);inDeg[t]++;});
  const result=[], remaining=new Set(modules);
  while(remaining.size>0){
    let batch=modules.filter(m=>remaining.has(m)&&inDeg[m]===0);
    if(batch.length===0){
      batch=[modules.filter(m=>remaining.has(m)).sort((a,b)=>inDeg[a]-inDeg[b])[0]];
    }
    batch.forEach(m=>{
      result.push(m);
      remaining.delete(m);
      adj[m].forEach(t=>{if(remaining.has(t))inDeg[t]--;});
    });
  }
  return result;
}

// 层分配（基于拓扑序的最长路径）
function assignLayers(modules, edges, topoOrder){
  const layer={};
  topoOrder.forEach(m=>{
    let maxL=-1;
    edges.forEach(([s,t])=>{if(t===m&&layer[s]!==undefined)maxL=Math.max(maxL,layer[s]);});
    layer[m]=maxL+1;
  });
  return layer;
}

// DAG布局
function layoutDAG(modules, edges){
  const topo=topologicalSort(modules,edges);
  const layer=assignLayers(modules,edges,topo);
  const groups={};
  modules.forEach(m=>{
    const l=layer[m];
    if(!groups[l])groups[l]=[];
    groups[l].push(m);
  });
  const LW=240, NH=56, NS=28;
  const positions={};
  Object.keys(groups).sort((a,b)=>a-b).forEach(l=>{
    const mods=groups[l];
    const totalH=mods.length*(NH+NS)-NS;
    const startY=-totalH/2;
    mods.forEach((m,i)=>{
      positions[m]={x:parseInt(l)*LW, y:startY+i*(NH+NS)};
    });
  });
  return positions;
}

// 获取模块角色
function getModuleRole(slug, modules, edges){
  if(MODULE_ROLE[slug])return MODULE_ROLE[slug];
  const hasIn=edges.some(([s,t])=>t===slug);
  const hasOut=edges.some(([s,t])=>s===slug);
  if(!hasIn)return "数据接入";
  if(!hasOut)return "结果输出";
  return "分析处理";
}

function matchCase(requirement){
  for(const [key,c] of Object.entries(CASES)){
    const matched=c.keywords.filter(k=>requirement.includes(k));
    if(matched.length>=2)return key;
  }
  return null;
}

function matchModules(requirement){
  const set=new Set();
  Object.entries(KEYWORD_MAP).forEach(([kw,mods])=>{
    if(requirement.includes(kw))mods.forEach(m=>set.add(m));
  });
  return [...set];
}

function completeUpstream(matched){
  const result=new Set(matched);
  const queue=[...matched];
  while(queue.length>0){
    const m=queue.shift();
    DATA_EDGES.forEach(([s,t])=>{
      if(t===m&&!result.has(s)){
        result.add(s);
        queue.push(s);
      }
    });
  }
  return [...result];
}

function generateEdges(modules){
  const set=new Set(modules);
  return DATA_EDGES.filter(([s,t])=>set.has(s)&&set.has(t));
}

    const hitKw=Object.keys(KEYWORD_MAP).filter(kw=>requirement.includes(kw));
    text+=hitKw.length>0?hitKw.join("、")+"（匹配 "+matched.length+" 个模块）":"未命中预设关键词\n";
    text+="\n【上游补全】\n";
    text+="根据 DATA_EDGES 递归补全上游依赖\n";
    text+="候选模块 "+matched.length+" → 组网后 "+modules.length+" 个模块\n";
    text+="\n【组网结果】\n";
    text+="共组网 "+modules.length+" 个模块，"+edges.length+" 条数据流边\n";
    const topo=topologicalSort(modules,edges);
    text+="执行顺序："+topo.map(s=>s.toUpperCase()).join(" → ");
  }
  return text;
}

function checkContracts(modules, edges){
  const issues=[];
  let checked=0;
  edges.forEach(([s,t])=>{
    checked++;
    const dt=getEdgeDataType(s,t);
    if(!dt){
      issues.push(M[s].name+" → "+M[t].name+": 未找到接口契约定义");
    }
  });
  return {valid:issues.length===0, checked, issues};
}

function planAuditLocal(requirement){
  const caseKey=matchCase(requirement);
  let modules, edges;
  if(caseKey){
    const c=CASES[caseKey];
    modules=c.modules;
    edges=c.edges;
  }else{
    const matched=matchModules(requirement);
    if(matched.length===0){
      return null;
    }
    modules=completeUpstream(matched);
    edges=generateEdges(modules);
  }
  const reasoning=generateReasoning(requirement, caseKey, modules, edges);
  return {modules, edges, reasoning, caseKey};
}

// 统一渲染规划结果（兼容后端和本地两种数据源）

  renderDAG(currentPlan);
  renderPlanDetails(currentPlan);

// 查找与当前模块组合完全匹配的预设案例
function findMatchingCase(modules){
  for(const caseId in CASES){
    const c=CASES[caseId];
    if(c.modules.length===modules.length &&
       modules.every(m=>c.modules.includes(m))){
      return caseId;
    }
  }
  return null;
}

// 获取模块执行结果（支持 LLM 返回的任意模块组合）
function getModuleResult(slug, stepIndex){
  // 先从当前匹配的案例中找
  if(currentPlan && currentPlan.caseKey &&
     CASES[currentPlan.caseKey].moduleResults &&
     CASES[currentPlan.caseKey].moduleResults[slug]){
    return CASES[currentPlan.caseKey].moduleResults[slug];
  }
  // 再从其他案例中找
  for(const caseId in CASES){
    const c=CASES[caseId];
    if(c.moduleResults && c.moduleResults[slug]){
      return c.moduleResults[slug];
    }
  }
  // 默认结果
  const m=M[slug];
  const name=m?m.name:slug;
  return {
    status:'done',
    duration:+(0.5+Math.random()*0.5).toFixed(1),
    summary:name+' 执行完成',
    output:{data_type:'分析结果', module:slug}
  };
}

// 调用后端 API 进行 LLM 规划，失败时回退到本地规划
async function planWithBackend(requirement){
  const planBtn=document.getElementById('plan-btn');
  const execBtn=document.getElementById('exec-btn');
  try{
    planBtn.textContent='AI 思考中...';
    planBtn.disabled=true;

    const resp=await fetch('http://localhost:9000/api/plan',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({requirement:requirement})
    });

    if(!resp.ok) throw new Error('HTTP '+resp.status);

    const data=await resp.json();
    if(!data.success) throw new Error(data.error||'未知错误');

    // 用后端返回的数据渲染
    currentPlan={
      modules:data.modules,
      edges:data.edges.map(e=>Array.isArray(e)?e:[e[0],e[1]]),
      reasoning:data.reasoning,
      steps:(data.steps||[]).map(s=>typeof s==='string'?s:s.slug),
      contract_valid:data.contract_valid,
      contract_issues:data.contract_issues||[]
    };

    renderPlan();
    execBtn.disabled=false;
    execBtn.classList.add('active');
    execBtn.textContent='执行';
    document.getElementById('report-area').style.display='none';
    clearLog();
    document.getElementById('exec-log').innerHTML='<div class="log-placeholder">方案已就绪（DeepSeek LLM），点击「执行」开始模拟运行...</div>';
    showStatus('✓ AI 规划完成（DeepSeek LLM）','success');
  }catch(err){
    // 回退到本地规划
    console.warn('后端调用失败，回退到本地规划:',err);
    showStatus('⚠ 后端未启动，使用本地关键词规划。启动后端：python backend.py','warn');
    const plan=planAuditLocal(requirement);
    if(!plan){
      alert('未能匹配到合适的审计模块，请尝试更具体的需求描述');
      return;
    }
    currentPlan=plan;
    renderPlan();
    execBtn.disabled=false;
    execBtn.classList.add('active');
    execBtn.textContent='执行';
    document.getElementById('report-area').style.display='none';
    clearLog();
    document.getElementById('exec-log').innerHTML='<div class="log-placeholder">方案已就绪（本地规划），点击「执行」开始模拟运行...</div>';
  }finally{
    planBtn.textContent='AI 规划方案';
    planBtn.disabled=false;
  }
}

/* ======================= DAG 渲染 ======================= */
const NODE_W=170, NODE_H=50;

function renderDAG(plan){
  const positions=layoutDAG(plan.modules, plan.edges);
  const g=document.getElementById('dag-content');
  let html="";

  // 边
  plan.edges.forEach(([s,t])=>{
    const p1=positions[s], p2=positions[t];
    if(!p1||!p2)return;
    const dt=getEdgeDataType(s,t);
    const isBackward=p2.x<p1.x;
    let x1,y1,x2,y2,d;
    if(!isBackward){
      x1=p1.x+NODE_W/2; y1=p1.y;
      x2=p2.x-NODE_W/2; y2=p2.y;
      const cx=(x1+x2)/2;
      d="M "+x1+" "+y1+" C "+cx+" "+y1+", "+cx+" "+y2+", "+x2+" "+y2;
    }else{
      x1=p1.x; y1=p1.y+NODE_H/2;
      x2=p2.x; y2=p2.y+NODE_H/2;
      const cy=Math.max(y1,y2)+45;
      d="M "+x1+" "+y1+" C "+x1+" "+cy+", "+x2+" "+cy+", "+x2+" "+y2;
    }
    html+="<path class=\"edge\" data-edge=\""+s+"->"+t+"\" d=\""+d+"\" marker-end=\"url(#arrowhead)\""+(isBackward?" stroke-dasharray=\"5 3\"":"")+"/>";
    // 边标签
    if(dt){
      let lx,ly;
      if(!isBackward){
        lx=(x1+x2)/2; ly=(y1+y2)/2;
      }else{
        lx=(x1+x2)/2; ly=Math.max(y1,y2)+45;
      }
      const labelW=dt.length*9+10;
      html+="<g class=\"edge-label\" transform=\"translate("+lx+","+ly+")\">";
      html+="<rect x=\""+(-labelW/2)+"\" y=\"-8\" width=\""+labelW+"\" height=\"16\" rx=\"8\"/>";
      html+="<text y=\"3\">"+dt+"</text>";
      html+="</g>";
    }
  });

  // 节点
  plan.modules.forEach(slug=>{
    const m=M[slug];
    const p=positions[slug];
    if(!p)return;
    const nameDisplay=m.name.length>10?m.name.slice(0,9)+"…":m.name;
    html+="<g class=\"node pending\" data-slug=\""+slug+"\" transform=\"translate("+p.x+","+p.y+")\">";
    html+="<rect x=\""+(-NODE_W/2)+"\" y=\""+(-NODE_H/2)+"\" width=\""+NODE_W+"\" height=\""+NODE_H+"\" rx=\"8\"/>";
    html+="<rect x=\""+(-NODE_W/2)+"\" y=\""+(-NODE_H/2)+"\" width=\"4\" height=\""+NODE_H+"\" rx=\"2\" fill=\""+m.color+"\"/>";
    html+="<text class=\"n-name\" y=\"-4\">"+nameDisplay+"</text>";
    html+="<text class=\"n-slug\" y=\"10\">"+slug.toUpperCase()+" · "+m.family+"</text>";
    html+="<text class=\"n-status\" x=\""+(NODE_W/2-14)+"\" y=\"4\">○</text>";
    html+="</g>";
  });

  g.innerHTML=html;
  document.getElementById('dag-empty').style.display='none';
  renderLegend();
  document.getElementById('dag-legend').style.display='flex';
  document.getElementById('dag-status-legend').style.display='flex';
  fitContent();
}

function renderLegend(){
  const lg=document.getElementById('dag-legend');
  let html="";
  const families={};
  currentPlan.modules.forEach(s=>{
    const f=M[s].family;
    if(!families[f])families[f]=0;
    families[f]++;
  });
  Object.entries(families).forEach(([f,c])=>{
    html+="<div class=\"lg-item\"><span class=\"lg-dot\" style=\"background:"+FAMILY_COLOR[f]+"\"></span>"+f+"("+c+")</div>";
  });
  lg.innerHTML=html;
}

function fitContent(){
  const g=document.getElementById('dag-content');
  const svg=document.getElementById('dag-canvas');
  if(!g||!svg)return;
  const bbox=g.getBBox();
  if(!bbox.width||!bbox.height)return;
  const cw=svg.clientWidth, ch=svg.clientHeight;
  const pad=50;
  const scale=Math.min((cw-pad*2)/bbox.width,(ch-pad*2)/bbox.height,1);
  const tx=cw/2-(bbox.x+bbox.width/2)*scale;
  const ty=ch/2-(bbox.y+bbox.height/2)*scale;
  g.setAttribute('transform',"translate("+tx+","+ty+") scale("+scale+")");
}

function updateNodeStatus(slug, status){
  const node=document.querySelector('[data-slug="'+slug+'"]');
  if(node){
    node.classList.remove('pending','running','done','failed');
    node.classList.add(status);
    const st=node.querySelector('.n-status');
    if(st){
      const icons={pending:'○',running:'◐',done:'✓',failed:'✗'};
      st.textContent=icons[status]||'○';
    }
  }
}

function updateEdgeStatus(s, t, done){
  const edge=document.querySelector('[data-edge="'+s+'->'+t+'"]');
  if(edge&&done){
    edge.classList.add('done');
    edge.setAttribute('marker-end','url(#arrowhead-done)');
  }
}

window.addEventListener('resize',()=>{if(currentPlan)fitContent();});

/* ======================= 规划详情面板渲染 ======================= */
function renderPlanDetails(plan){
  // AI 推理过程（保留换行，后端返回的 reasoning 包含多行）
  const reasoningEl=document.getElementById('reasoning');
  reasoningEl.innerHTML='<div id="reasoning-text"></div>';
  document.getElementById('reasoning-text').textContent=plan.reasoning||'';

  // 选中模块
  const ml=document.getElementById('modules-list');
  let mlHtml="";
  plan.modules.forEach(slug=>{
    const m=M[slug];
    if(!m)return;
    const role=getModuleRole(slug, plan.modules, plan.edges);
    mlHtml+="<div class=\"module-item\">";
    mlHtml+="<span class=\"mi-dot\" style=\"background:"+m.color+"\"></span>";
    mlHtml+="<span class=\"mi-name\">"+m.name+"</span>";
    mlHtml+="<span class=\"mi-family\">"+m.family+"</span>";
    mlHtml+="<span class=\"mi-role\">"+role+"</span>";
    mlHtml+="</div>";
  });
  ml.innerHTML=mlHtml;

  // 接口契约校验（优先使用后端返回结果，否则本地计算）
  let cc;
  if(plan.contract_valid!==undefined){
    cc={
      valid:plan.contract_valid,
      checked:plan.edges.length,
      issues:plan.contract_issues||[]
    };
  }else{
    cc=checkContracts(plan.modules, plan.edges);
  }
  const ccEl=document.getElementById('contract-check');
  let ccHtml="";
  if(cc.valid){
    ccHtml+="<div class=\"contract-ok\">✓ 契约一致</div>";
    ccHtml+="<div class=\"contract-detail\">已校验 "+cc.checked+" 条数据流接口，全部通过</div>";
  }else{
    ccHtml+="<div class=\"contract-fail\">✗ 发现 "+cc.issues.length+" 个问题</div>";
    cc.issues.forEach(iss=>{
      ccHtml+="<div class=\"contract-detail\">• "+iss+"</div>";
    });
  }
  ccEl.innerHTML=ccHtml;

  // 执行顺序（优先使用后端返回的 steps，否则本地拓扑排序）
  const topo=plan.steps||topologicalSort(plan.modules, plan.edges);
  const eoEl=document.getElementById('exec-order');
  let eoHtml="<div class=\"exec-order\">";
  topo.forEach((s,i)=>{
    const m=M[s];
    if(!m)return;
    eoHtml+="<span class=\"eo-node\" style=\"background:"+m.color+"\">"+s.toUpperCase()+"</span>";
    if(i<topo.length-1)eoHtml+="<span class=\"eo-arrow\">→</span>";
  });
  eoHtml+="</div>";
  eoEl.innerHTML=eoHtml;
}

/* ======================= 执行日志 ======================= */
function clearLog(){
  const log=document.getElementById('exec-log');
  log.innerHTML="";
}
function addLog(step, moduleName, status, duration, summary){
  const log=document.getElementById('exec-log');
  const time=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  const entry=document.createElement('div');
  entry.className='log-entry';
  let html="<span class=\"log-time\">["+time+"]</span>";
  html+="<span class=\"log-step\">#"+step+"</span>";
  html+="<span class=\"log-module\">"+moduleName+"</span>";
  html+="<span class=\"log-status-"+status+"\">"+(status==='running'?'▶ 执行中':status==='done'?'✓ 完成':'✗ 失败')+"</span>";
  if(duration)html+="<span class=\"log-duration\">"+duration+"s</span>";
  if(summary)html+="<span class=\"log-summary\">"+summary+"</span>";
  entry.innerHTML=html;
  log.appendChild(entry);
  log.scrollTop=log.scrollHeight;
}

/* ======================= 最终报告渲染 ======================= */
function renderReport(report, plan){
  const area=document.getElementById('report-area');
  const el=document.getElementById('final-report');
  let html="";

  // 审计结论
  html+="<div class=\"report-card\">";
  html+="<div class=\"rc-title\">审计结论</div>";
  html+="<div class=\"rc-body\">"+report.audit_conclusion+"</div>";
  html+="</div>";

  // 风险评级
  html+="<div class=\"report-card rc-risk\">";
  html+="<div class=\"rc-title\">风险评级</div>";
  html+="<div class=\"rc-body\"><span class=\"risk-badge risk-"+report.risk_level+"\">"+report.risk_level+"风险</span></div>";
  html+="</div>";

  // 审计发现
  html+="<div class=\"report-card rc-finding\">";
  html+="<div class=\"rc-title\">审计发现汇总</div>";
  html+="<div class=\"rc-body\">";
  report.findings.forEach((f,i)=>{
    html+="<div class=\"finding-item\">"+f+"</div>";
  });
  html+="</div></div>";

  // 各模块关键输出（兼容后端 LLM 返回的任意模块组合）
  if(plan.modules && plan.modules.length>0){
    html+="<div class=\"report-card\">";
    html+="<div class=\"rc-title\">各模块关键输出</div>";
    html+="<div class=\"rc-body\">";
    plan.modules.forEach(slug=>{
      const m=M[slug];
      if(!m)return;
      const result=getModuleResult(slug, 0);
      if(!result)return;
      html+="<div class=\"mo-card\">";
      html+="<div class=\"mo-header\">";
      html+="<span class=\"mo-dot\" style=\"background:"+m.color+"\"></span>";
      html+="<span class=\"mo-name\">"+m.name+"</span>";
      html+="<span class=\"mo-time\">"+result.duration+"s</span>";
      html+="</div>";
      html+="<div class=\"mo-summary\">"+result.summary+"</div>";
      if(result.output){
        Object.entries(result.output).forEach(([k,v])=>{
          if(typeof v==='object'&&v!==null&&!Array.isArray(v)){
            const parts=Object.entries(v).map(([k2,v2])=>k2+"="+v2).join(", ");
            html+="<div class=\"mo-field\"><span class=\"mo-key\">"+k+":</span> "+parts+"</div>";
          }else if(Array.isArray(v)){
            html+="<div class=\"mo-field\"><span class=\"mo-key\">"+k+":</span> "+v.join("; ")+"</div>";
          }else{
            html+="<div class=\"mo-field\"><span class=\"mo-key\">"+k+":</span> "+v+"</div>";
          }
        });
      }
      html+="</div>";
    });
    html+="</div></div>";
  }

  // 审计建议
  html+="<div class=\"report-card rc-rec\">";
  html+="<div class=\"rc-title\">审计建议</div>";
  html+="<div class=\"rc-body\">";
  report.recommendations.forEach((r,i)=>{
    html+="<div class=\"rec-item\">"+r+"</div>";
  });
  html+="</div></div>";

  el.innerHTML=html;
  area.style.display='flex';
}

/* ======================= 模拟执行 ======================= */
function genericModuleResult(slug){
  const m=M[slug];
  return {
    status:"done",
    duration:+(0.5+Math.random()).toFixed(1),
    summary:m.name+" 执行完成，输出"+m.family+"分析结果",
    output:{data_type:"分析结果",module:slug,family:m.family}
  };
}

function genericFinalReport(modules){
  return {
    audit_conclusion:"审计执行完成，共运行"+modules.length+"个模块，请查看各模块输出",
    risk_level:"中",
    findings:modules.map(s=>M[s].name+" 模块分析完成"),
    recommendations:["建议根据各模块输出进一步深入分析","建议建立持续监控机制跟踪风险变化"]
  };
}

async function executePlan(){
  if(!currentPlan||isExecuting)return;
  isExecuting=true;
  const plan=currentPlan;
  const execBtn=document.getElementById('exec-btn');
  execBtn.classList.remove('active');
  execBtn.classList.add('running');
  execBtn.textContent='执行中...';

  // 重置节点状态
  plan.modules.forEach(s=>updateNodeStatus(s,'pending'));
  // 重置边状态
  plan.edges.forEach(([s,t])=>{
    const edge=document.querySelector('[data-edge="'+s+'->'+t+'"]');
    if(edge){edge.classList.remove('done');edge.setAttribute('marker-end','url(#arrowhead)');}
  });

  clearLog();
  document.getElementById('report-area').style.display='none';

  // 优先使用后端返回的执行顺序，否则本地拓扑排序
  const topo=plan.steps||topologicalSort(plan.modules, plan.edges);
  let step=0;

  addLog(0,'编排引擎','done',null,'开始执行审计方案，共 '+topo.length+' 个模块');
  await sleep(300);

  for(const slug of topo){
    step++;
    const m=M[slug];

    // 设置 running
    updateNodeStatus(slug,'running');
    addLog(step,m.name,'running',null,'开始执行...');

    // 获取结果（支持 LLM 返回的任意模块组合）
    const result=getModuleResult(slug, step);

    // 模拟执行延迟 (800-1500ms)
    const delay=Math.max(800,Math.min(1500,result.duration*1000));
    await sleep(delay);

    // 设置 done
    updateNodeStatus(slug,'done');
    // 标记上游边为完成
    plan.edges.forEach(([s,t])=>{
      if(t===slug)updateEdgeStatus(s,t,true);
    });
    addLog(step,m.name,'done',result.duration,result.summary);
  }

  await sleep(300);
  addLog(step+1,'编排引擎','done',null,'全部模块执行完成，生成审计报告');

  // 展示报告：优先匹配预设案例，否则使用通用报告
  const matchedCase=plan.caseKey||findMatchingCase(plan.modules);
  const report=matchedCase?CASES[matchedCase].finalReport:genericFinalReport(plan.modules);
  renderReport(report, plan);

  execBtn.classList.remove('running');
  execBtn.classList.add('active');
  execBtn.textContent='重新执行';
  isExecuting=false;
}
